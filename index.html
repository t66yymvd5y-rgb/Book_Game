<title>Corner Books</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Flat, outlined UI: white cards with a navy ink outline, each sitting on an offset coloured
     block (blue, orange or yellow), pill buttons, rounded sans. */
  :root{
    --ink:#1d2340; --ink-dim:#5d6382; --muted:#9a9fb6; --bg:#f6f6fa; --card:#ffffff; --line:#e7e8f0;
    --blue:#3aa8e8; --blue-soft:#e4f3fd; --orange:#f26b3a; --orange-soft:#fde8e0;
    --yellow:#ffc527; --yellow-soft:#fff4cf; --green:#3fbf68; --green-soft:#e1f6e7; --red:#e5484d; --red-soft:#fde5e5;
    --lw:2px; --r:18px;
    --lift-blue:5px 6px 0 -2px var(--blue),5px 6px 0 0 var(--ink);
    --lift-orange:5px 6px 0 -2px var(--orange),5px 6px 0 0 var(--ink);
    --lift-yellow:5px 6px 0 -2px var(--yellow),5px 6px 0 0 var(--ink);
    --lift-ink:0 3px 0 0 var(--ink);
    --sans:"Poppins", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    color:var(--ink); font-family:var(--sans); font-size:13px; line-height:1.55;
    background:
      radial-gradient(circle at 6% 30%, #e9f4fc 0 90px, transparent 91px),
      radial-gradient(circle at 96% 62%, #fde9e3 0 120px, transparent 121px),
      radial-gradient(circle at 88% 8%, #fff3cf 0 60px, transparent 61px),
      var(--bg);
    background-attachment:fixed;
    overscroll-behavior:none; user-select:none; -webkit-user-select:none;
  }
  #wrap{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 28px;gap:14px;}

  /* ---- top bar ---- */
  #top{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--lw) solid var(--ink);border-radius:22px;
    padding:8px 10px;box-shadow:var(--lift-yellow);}
  .logo{width:36px;height:36px;flex:none;border-radius:50%;background:var(--orange);border:var(--lw) solid var(--ink);
    display:grid;place-items:center;color:#fff;}
  .logo svg{width:18px;height:18px;}
  #brand{flex:1;min-width:0;}
  #brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;line-height:1.2;}
  #brand b{display:block;font-size:15px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #me{width:38px;height:38px;flex:none;border-radius:50%;border:var(--lw) solid var(--ink);overflow:hidden;background:var(--yellow-soft);}
  #me img{width:100%;height:100%;display:block;}
  /* sits above the pop-up layer (#modal, z-index 50) so it can be muted mid-conversation */
  #music{position:relative;z-index:60;width:38px;height:38px;flex:none;padding:0;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;}
  #music svg{width:18px;height:18px;}
  #music.off{background:#eef0f5;color:var(--muted);}

  /* ---- HUD: the stat strip ---- */
  #hud{display:flex;background:var(--card);border:var(--lw) solid var(--ink);border-radius:999px;padding:7px 6px;}
  .stat{flex:1;text-align:center;min-width:0;}
  .stat+.stat{border-left:var(--lw) solid var(--ink);}
  .stat span{display:block;font-size:10px;color:var(--ink-dim);font-weight:500;line-height:1.3;}
  .stat b{display:block;font-size:13px;font-weight:700;line-height:1.4;}

  /* ---- canvas stage ---- */
  #stage{position:relative;width:100%;margin:0 auto;border:var(--lw) solid var(--ink);border-radius:var(--r);
    overflow:hidden;background:#fbf6ec;box-shadow:var(--lift-blue);}
  #stageWrap{padding:0 5px 6px 0;}
  canvas{display:block;width:100%;touch-action:manipulation;}
  #signText{position:absolute;left:10%;right:10%;top:0;text-align:center;font-weight:700;color:var(--ink);
    line-height:1; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:clip;
    pointer-events:none; transform:translateY(-50%);}
  #tip{font-size:12px;color:var(--ink-dim);font-weight:500;display:flex;gap:8px;align-items:flex-start;min-height:20px;}
  #tip::before{content:"";flex:none;width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--orange);border:1.5px solid var(--ink);}

  /* ---- panel ---- */
  #panel{flex:1;display:flex;flex-direction:column;gap:12px;}
  #action:empty{display:none;}
  h2{font-size:17px;font-weight:700;margin:0;line-height:1.35;}
  h3{font-size:11px;font-weight:600;margin:12px 0 6px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;}
  p{margin:0;color:var(--ink-dim);font-size:13px;line-height:1.6;}
  #sheet p{margin:0 0 10px;}

  /* tabs: the orange "Explore" bar */
  .tabs{display:flex;gap:6px;align-items:center;background:var(--orange);border:var(--lw) solid var(--ink);border-radius:999px;padding:6px;}
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 4px;border-radius:999px;color:#fff;
    font-size:12px;font-weight:600;cursor:pointer;border:var(--lw) solid transparent;}
  .tab svg{width:16px;height:16px;flex:none;}
  .tab.on{background:var(--yellow);color:var(--ink);border-color:var(--ink);}

  /* buttons: pills */
  button{font-family:var(--sans);font-size:12px;font-weight:600;line-height:1.3;cursor:pointer;color:var(--ink);
    border:var(--lw) solid var(--ink);border-radius:999px;background:var(--card);padding:8px 14px;}
  button:active{transform:translateY(1px);}
  button:disabled{cursor:default;background:#eef0f5;color:var(--muted);border-color:#c5c9d8;}
  .btn-go{display:block;width:100%;background:var(--yellow);padding:14px;font-size:15px;font-weight:700;box-shadow:var(--lift-ink);}
  .btn-go:active{box-shadow:none;transform:translateY(3px);}
  .btn-sm{padding:7px 14px;font-size:12px;}
  .btn-y{background:var(--yellow);}
  .btn-o{background:var(--orange);color:#fff;}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}

  /* cards */
  .card{position:relative;background:var(--card);border:var(--lw) solid var(--ink);border-radius:var(--r);padding:12px;
    display:flex;gap:12px;align-items:flex-start;}
  .card.lift{box-shadow:var(--lift-blue);margin:0 5px 6px 0;}
  .card canvas{width:58px;height:87px;flex:none;border:var(--lw) solid var(--ink);border-radius:6px;}
  .card .meta{flex:1;min-width:0;}
  .t{font-size:15px;font-weight:700;line-height:1.3;color:var(--ink);}
  .a{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .tagrow{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;}
  .tag{font-size:11px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--yellow-soft);border:1.5px solid var(--ink);color:var(--ink);}
  .tag.g{background:var(--green-soft);}
  .tag.b{background:var(--blue-soft);}
  .tag.r{background:var(--orange-soft);}
  .price{font-size:16px;font-weight:700;color:var(--orange);}
  .cost{font-size:12px;color:var(--ink-dim);}
  .stars{color:var(--yellow);letter-spacing:1px;font-size:13px;-webkit-text-stroke:.6px var(--ink);}
  .stars + small{font-size:11px;color:var(--muted);margin-left:4px;}
  .cta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;flex-wrap:wrap;}

  .empty{text-align:center;color:var(--ink-dim);padding:22px 8px;font-size:13px;line-height:1.8;background:var(--card);
    border:var(--lw) dashed var(--ink);border-radius:var(--r);}

  /* stepper: the QTY bar */
  .qty{display:flex;align-items:center;gap:8px;background:var(--blue);border:var(--lw) solid var(--ink);border-radius:999px;padding:5px;margin-top:8px;}
  .stepper{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:var(--lw) solid var(--ink);
    border-radius:999px;padding:2px 4px 2px 12px;min-width:0;}
  .stepper > span{font-size:11px;font-weight:600;color:var(--ink-dim);}
  .stepper b{font-size:13px;font-weight:700;}
  .stepper button{border:0;background:none;padding:4px 7px;font-size:16px;line-height:1;}
  .stepper button:disabled{background:none;}
  .qty > button{flex:none;}

  /* list: the blue settings panel */
  .list{background:var(--blue);border:var(--lw) solid var(--ink);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;}
  .li{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--lw) solid var(--ink);border-radius:14px;padding:9px 10px;text-align:left;width:100%;}
  .li .ic{width:32px;height:32px;flex:none;border-radius:50%;background:var(--orange-soft);border:1.5px solid var(--orange);color:var(--orange);display:grid;place-items:center;}
  .li .ic svg{width:16px;height:16px;}
  .li .meta{flex:1;min-width:0;}
  .li .t{font-size:13px;}
  .li .a{font-size:11px;margin-top:0;}
  .li.lock{opacity:.6;}

  /* customer ring */
  .ring{position:relative;width:46px;height:46px;flex:none;}
  .ring svg{width:46px;height:46px;transform:rotate(-90deg);}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--orange);}
  .avatar{width:46px;height:46px;flex:none;border-radius:50%;border:var(--lw) solid var(--ink);display:block;}
  .card .avatar{border-radius:50%;}
  .cust{align-items:center;padding:10px;}
  .cust .inner{flex:1;display:flex;align-items:center;gap:10px;border:1.5px dashed var(--ink);border-radius:14px;padding:6px 8px;min-width:0;}
  .go{width:34px;height:34px;flex:none;padding:0;border-radius:10px;display:grid;place-items:center;font-size:16px;}
  .feed{display:flex;flex-direction:column;gap:2px;}

  /* ledger + total */
  .ledgerbox{background:var(--card);border:var(--lw) solid var(--ink);border-radius:var(--r);padding:4px 14px;}
  .ledger{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 0;border-bottom:1.5px solid var(--line);}
  .ledger:last-child{border-bottom:0;}
  .ledger b{font-size:14px;font-weight:700;}
  .ledger.neg b{color:var(--red);}
  .ledger.pos b{color:var(--green);}
  .total{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:var(--lw) solid var(--ink);
    border-radius:var(--r);padding:14px 16px;box-shadow:var(--lift-yellow);margin:0 5px 6px 0;}
  .total span{font-size:16px;font-weight:600;}
  .total b{font-size:24px;font-weight:700;}
  .total.neg b{color:var(--red);}

  /* ---- modal ---- */
  #modal{position:fixed;inset:0;background:rgba(29,35,64,.45);display:none;z-index:50;align-items:flex-end;justify-content:center;}
  #modal.on{display:flex;}
  #sheetWrap{position:relative;width:100%;max-width:460px;}
  #sheet{width:100%;max-height:92vh;overflow-y:auto;background:var(--card);
    border:var(--lw) solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 16px 20px;}
  #sheet::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:#d5d8e4;margin:0 auto 26px;}
  /* close button: outside the scrolling sheet, so it stays in the top-right corner however far down you are */
  #sheetX{position:absolute;top:10px;right:12px;z-index:2;width:34px;height:34px;padding:0;border-radius:50%;
    display:grid;place-items:center;background:var(--card);box-shadow:var(--lift-ink);}
  #sheetX svg{width:16px;height:16px;}
  #sheetX:active{box-shadow:none;transform:translateY(3px);}
  #modal.locked #sheetX{display:none;}
  #modal.locked #sheet::before{margin-bottom:12px;}
  .speaker{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;margin-bottom:12px;line-height:1.3;}
  .speaker small{display:block;font-size:12px;font-weight:500;color:var(--ink-dim);}
  .say{position:relative;background:var(--card);border:var(--lw) solid var(--ink);border-radius:4px 16px 16px 16px;padding:9px 12px;font-size:13px;
    line-height:1.55;color:var(--ink);margin:0 34px 8px 0;white-space:pre-line;}
  .say.me{background:var(--blue);color:#fff;border-radius:16px 4px 16px 16px;margin:0 0 8px 34px;}
  .keeper-portrait{display:block;width:100%;border-radius:var(--r);margin-bottom:14px;border:var(--lw) solid var(--ink);}
  .choice{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font-size:13px;font-weight:500;
    padding:11px 14px;border-radius:14px;margin-bottom:8px;}
  .list .choice{margin:0;}
  .choice::after{content:"›";font-size:20px;line-height:.8;font-weight:500;}
  .choice.primary{background:var(--orange);color:#fff;border-radius:999px;justify-content:center;font-weight:600;font-size:14px;box-shadow:var(--lift-ink);margin-top:12px;}
  .choice.primary::after{content:"";}
  .choice.ghost{border-color:transparent;background:none;justify-content:center;color:var(--ink-dim);}
  .choice.ghost::after{content:"";}
  .clues{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .clues .tag::before{content:"✓ ";color:var(--green);font-weight:700;}
  .pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0 12px;}
  .pick .bk{background:var(--card);border:var(--lw) solid var(--ink);border-radius:14px;padding:7px;text-align:center;cursor:pointer;}
  .pick .bk canvas{width:100%;height:auto;aspect-ratio:2/3;border:var(--lw) solid var(--ink);border-radius:6px;}
  .pick .bk div{font-size:11px;font-weight:600;margin-top:5px;line-height:1.35;}
  .pick .bk span{color:var(--orange);font-weight:700;}
  .verdict{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;font-size:14px;font-weight:700;margin:10px 0;
    border-radius:999px;border:var(--lw) solid var(--ink);}
  .verdict.good{background:var(--green-soft);}
  .verdict.bad{background:var(--red-soft);}
  .verdict.good::before{content:"✓";display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--green);color:#fff;border:1.5px solid var(--ink);font-size:12px;}
  .verdict.bad::before{content:"✕";display:grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--red);color:#fff;border:1.5px solid var(--ink);font-size:12px;}

  .bookhead{display:flex;gap:14px;margin-bottom:12px;align-items:flex-start;}
  .bookhead canvas{width:96px;height:144px;flex:none;border:var(--lw) solid var(--ink);border-radius:8px;box-shadow:4px 5px 0 0 var(--ink);}
  .bookhead .t{font-size:18px;}
  .bookhead .price{margin-top:6px;}
  .review{font-size:12px;color:var(--ink-dim);line-height:1.6;}
  .review b{display:block;font-size:13px;color:var(--ink);margin-bottom:3px;}
  .facts{display:flex;border:var(--lw) solid var(--ink);border-radius:999px;padding:6px 4px;margin:4px 0 12px;}
  .buy{display:block;width:100%;background:var(--yellow);padding:13px;margin-top:14px;font-size:14px;font-weight:700;box-shadow:var(--lift-ink);}
  .note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px;}

  .lock{opacity:.55;}
  .field{background:var(--card);border:var(--lw) solid var(--ink);border-radius:var(--r);padding:10px 14px;margin:10px 0 6px;}
  .field label{display:block;font-size:12px;color:var(--ink-dim);font-weight:500;}
  .namerow{display:flex;align-items:center;gap:8px;}
  .namerow span{font-size:15px;font-weight:700;white-space:nowrap;}
  #shopName{flex:1;min-width:0;font-family:var(--sans);font-size:15px;font-weight:700;padding:2px 0;border:0;background:none;color:var(--ink);}
  #shopName:focus{outline:none;}
  #shopName::placeholder{color:#c3c6d4;font-weight:500;}
  .check{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--ink);background:#eef0f5;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;}
  .check.on{background:var(--green);}
  .t,button,h2,h3,.speaker,.verdict,.stat b{overflow-wrap:anywhere;}

  /* ---- title screen ---- */
  #menuBtn{width:38px;height:38px;flex:none;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--card);}
  #menuBtn svg{width:18px;height:18px;}
  #title{position:fixed;inset:0;z-index:40;display:none;overflow-y:auto;background:inherit;}
  #title.on{display:block;}
  #titleIn{max-width:460px;margin:0 auto;min-height:100%;padding:24px 16px 28px;display:flex;flex-direction:column;justify-content:center;gap:14px;}
  .hero{background:var(--card);border:var(--lw) solid var(--ink);border-radius:var(--r);overflow:hidden;box-shadow:var(--lift-blue);margin:0 5px 6px 0;}
  .hero img{display:block;width:100%;border-bottom:var(--lw) solid var(--ink);}
  .mark{display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .mark .logo{width:46px;height:46px;}
  .mark .logo svg{width:22px;height:22px;}
  .mark h1{margin:0;font-size:26px;font-weight:700;line-height:1.15;letter-spacing:.2px;}
  .mark small{display:block;font-size:12px;color:var(--ink-dim);font-weight:500;line-height:1.4;}
  .resume .tagrow{margin-top:8px;}
  .btn-w{background:var(--card);}
  .menu-foot{font-size:11px;color:var(--muted);text-align:center;line-height:1.6;}
  button.li{font-size:13px;font-weight:500;}
  .li.danger .ic{background:var(--red-soft);border-color:var(--red);color:var(--red);}
  /* the top-bar music button floats above pop-ups; on the title screen it gets its own toggle instead */
  body.titling #music{visibility:hidden;}
  .title-music{align-self:center;}

  /* ---- stock take ---- */
  #stockBtn{width:38px;height:38px;flex:none;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--yellow-soft);}
  #stockBtn svg{width:18px;height:18px;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px;}
  .chip{padding:4px 10px;font-size:11px;font-weight:600;background:var(--card);}
  .chip.on{background:var(--yellow);}
  .seg{display:flex;gap:6px;margin:4px 0 10px;}
  .seg button{flex:1;}
  .seg button.on{background:var(--orange);color:#fff;}
  .blurb{font-size:12px;line-height:1.6;color:var(--ink-dim);margin-top:6px;}
  .stlist{display:flex;flex-direction:column;gap:10px;}
  .stlist .card{cursor:pointer;}
  .count{font-size:12px;color:var(--ink-dim);margin:0 0 8px;}
  /* shortlist: books pulled for a customer */
  .sl{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--lw) solid var(--ink);border-radius:14px;padding:8px;margin-bottom:8px;cursor:pointer;}
  .sl canvas{width:40px;height:60px;flex:none;border:1.5px solid var(--ink);border-radius:4px;}
  .sl .meta{flex:1;min-width:0;}
  .sl .t{font-size:13px;}
  .sl .a{font-size:11px;margin-top:0;}
  .sl.on{background:var(--yellow-soft);}
  .sl .read{flex:none;padding:5px 10px;font-size:11px;}
  .sl .check{width:24px;height:24px;}
  .sl.off{opacity:.5;}
  .li .mini{flex:none;border:1.5px solid var(--ink);border-radius:4px;}
  .prelude{font-size:14px;line-height:1.7;color:var(--ink);margin:0 0 12px;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<div id="wrap">
  <header id="top">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h13v13H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/></svg></div>
    <div id="brand"><small>Old Quarter · bookshop</small><b id="brandName">Corner Books</b></div>
    <button id="music" type="button" aria-label="Music on" aria-pressed="true"></button>
    <div id="me"></div>
    <button id="stockBtn" aria-label="Stock take"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6v3H9zM7 5.5H5v15h14v-15h-2M8.5 11h7M8.5 15h7"/></svg></button>
    <button id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </header>
  <audio id="bgm" src="audio/paperback-afternoon.mp3" loop preload="auto"></audio>
  <div id="hud">
    <div class="stat"><span>Day</span><b id="hDay">1</b></div>
    <div class="stat"><span>Cash</span><b id="hCash">$1500</b></div>
    <div class="stat"><span>Reputation</span><b id="hRep">0</b></div>
    <div class="stat"><span>Phase</span><b id="hPhase">Setup</b></div>
  </div>
  <div id="stageWrap"><div id="stage"><canvas id="cv"></canvas><div id="signText"></div></div></div>
  <div id="tip">Tap OPEN when your shelves are ready.</div>
  <div id="action"></div>
  <div id="panel"></div>

// Ancient works carry an approximate year: negative = BC, so -725 reads "c. 8th century BC".
function yearText(y){
  if(y<0){ const c=Math.ceil(-y/100), t=c%100>10&&c%100<14?"th":["th","st","nd","rd"][c%10]||"th"; return "c. "+c+t+" century BC"; }
  return y<1000?"c. AD "+y:String(y);
}
function ratingFor(bk){ const r=RATINGS[bk.title]; return r?{avg:r[0],count:r[1]}:{avg:4.0,count:5000}; }
function starsFor(avg){ const full=clamp(Math.round(avg),0,5); return "★".repeat(full)+"☆".repeat(5-full); }
function fmtCount(n){
  if(n>=1000000) return (n/1000000).toFixed(n>=10000000?0:1)+"M";
  if(n>=1000) return Math.round(n/1000)+"K";
  return String(n);
}
function ratingBlock(bk){
  const rt=ratingFor(bk);
  const d=el("div","review");
  d.appendChild(el("b",null,"<span class='stars'>"+starsFor(rt.avg)+"</span>  "+rt.avg.toFixed(2)+" / 5"));
  d.appendChild(el("span",null,fmtCount(rt.count)+" ratings from real readers, aggregated across major book-review sites."));
  return d;
}

/* ---------- shop grid ---------- */
let GW=12, GH=9, PX=4; const TS=16;   // PX: device px per game px, sized to the stage in resizeStage()
const EMPTY=0, WALL=1, SHELF=2, COUNTER=3, TABLE=4, PLANT=5, CAFE=6, DOOR=7, CAT=8;
const SHELF_SLOTS=10;                // titles per shelf
const START_TITLES=100;              // grandfather's stock: this many random titles, one copy each
const FURN={
  [SHELF]:{name:"Shelf",cost:120,slots:SHELF_SLOTS,desc:"Holds "+SHELF_SLOTS+" titles"},
  [TABLE]:{name:"Display Table",cost:200,slots:1,desc:"Featured title, +40% notice",lvl:2},
  [PLANT]:{name:"Potted Palm",cost:60,slots:0,desc:"+ambience, slower exits"},
  [CAFE]:{name:"Coffee Corner",cost:900,slots:0,desc:"+50% patience, all customers",lvl:3},
};

/* Space tiers. The game starts in grandfather's shop, already a mature bookshop. Rent is tied to
   floor size, not reputation: growth is a choice the player makes and pays for once. */
const SIZE_TIERS=[
  {name:"Grandfather's Shop", gw:12, gh:9,  rent:50,  cost:0,    rep:0},
  {name:"Extended Shop",      gw:14, gh:10, rent:90,  cost:1500, rep:15},
  {name:"Double Shopfront",   gw:16, gh:11, rent:130, cost:3200, rep:30},
];

const S={
  phase:"morning", day:1, cash:1500, rep:0, tier:0,
  grid:[], slots:{},          // tileKey -> [bookId,...]
  stock:{},                   // bookId -> {copies, price, auto, cost}
  incoming:[],                // orders on their way: [{id, n, due}] — due is the morning they arrive
  sales:[],                   // today's sales, for the evening list: [{name, id, price, restocked}]
  offers:[],                  // the morning van: new titles on offer today (from day 2)
  customers:[], tick:0, dayLen:900,
  spawnQueue:[], talking:null, placing:null,
  stats:{rev:0,spent:0,served:0,delighted:0,missed:0,walkouts:0},
  history:[], soldEver:{}, tab:"stock", featured:null,
  seen:{}, tutorial:true, shopName:"", keeper:null, seenToday:[], dayCast:[],
  footfall:0,
  library:{},                 // archetypeKey -> {bookId: dayBought} — what each reader already owns
};

function key(x,y){return x+","+y;}
function doorX(){ return Math.floor(GW/2); }
function initGrid(preserve){
  const oldGrid=preserve?S.grid:null, oldSlots=preserve?S.slots:null;
  const prevGW=preserve?oldGrid[0].length:0, prevGH=preserve?oldGrid.length:0;
  S.grid=[];
  for(let y=0;y<GH;y++){ const row=[]; for(let x=0;x<GW;x++){
    let t=EMPTY;
    const border = y===0||x===0||x===GW-1||y===GH-1;
    if(border) t=WALL;
    if(y===GH-1 && x===doorX()) t=DOOR;
    if(preserve && y<prevGH && x<prevGW){
      const was=oldGrid[y][x];
      const wasBorder = y===0||x===0||x===prevGW-1||y===prevGH-1;
      if(!border) t = wasBorder ? EMPTY : was;   // old wall/door now interior -> floor; old furniture kept
    }
    row.push(t);
  } S.grid.push(row);}
  if(preserve){
    const newSlots={};
    Object.keys(oldSlots).forEach(k=>{
      const [x,y]=k.split(",").map(Number);
      if(x<GW-1 && y<GH-1 && (S.grid[y][x]===SHELF||S.grid[y][x]===TABLE)) newSlots[k]=oldSlots[k];
    });
    S.slots=newSlots;
  } else {
    S.slots={};
    const dx=doorX();
    // Grandfather's layout: a run of shelves along the back wall either side of the counter,
    // two island runs in the middle, a palm by the window and the cat in the far corner.
    // Every shelf has open floor directly below it, which is where a browsing customer stands.
    [[1,1],[2,1],[3,1],[4,1],[8,1],[9,1],[10,1],[2,4],[3,4],[4,4],[8,4],[9,4]]
      .forEach(([x,y])=>{S.grid[y][x]=SHELF; S.slots[key(x,y)]=[];});
    S.grid[2][dx]=COUNTER; S.grid[GH-2][1]=PLANT; S.grid[GH-2][GW-2]=CAT;
    S.keeper=[dx,1];   // you, standing behind the counter
  }
  resizeStage();
}
function resizeStage(){
  const cv2=$("#cv"); if(!cv2) return;
  const stage=$("#stage");
  stage.style.maxWidth="min(100%, calc(52vh * "+GW+" / "+GH+"))";
  // vector art: size the backing store to the stage's real device pixels so outlines stay crisp
  const cssW=stage.clientWidth||428;
  PX=Math.max(2,Math.ceil(cssW*(window.devicePixelRatio||1)/(GW*TS)));
  cv2.width=GW*TS*PX; cv2.height=GH*TS*PX;
  const g=cv2.getContext("2d"); g.setTransform(PX,0,0,PX,0,0);
  const sign=$("#signText");
  if(sign){ sign.style.top=(7/(GH*TS)*100)+"%"; sign.style.fontSize=(cssW/(GW*TS)*5.4).toFixed(1)+"px"; }
}
window.addEventListener("resize",()=>resizeStage());
function tilesOf(type){const o=[];for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(S.grid[y][x]===type)o.push([x,y]);return o;}
function level(){ return S.rep>=45?3 : S.rep>=18?2 : 1; }
function rent(){ return SIZE_TIERS[S.tier].rent; }
function baseFootfall(){ return 5 + S.tier*2 + level() + Math.floor(S.rep/12); }
// Actual footfall is never the same two days running: the floor, plus a random swing,
// plus an occasional busy day. A quiet Tuesday and a packed Saturday should feel different.
function rollFootfall(){
  const base=baseFootfall();
  return base + ((Math.random()*4)|0) + (Math.random()<0.18 ? 2+((Math.random()*3)|0) : 0);
}
function nextTier(){ return S.tier<SIZE_TIERS.length-1 ? SIZE_TIERS[S.tier+1] : null; }
function upgradeSpace(){
  const nt=nextTier(); if(!nt) return;
  if(S.cash<nt.cost || S.rep<nt.rep) return;
  S.cash-=nt.cost; S.stats.spent+=nt.cost; S.tier++;
  GW=nt.gw; GH=nt.gh;
  initGrid(true);
  // the cat follows the corner: it moves to the new far corner if that spot is free
  const [cx,cy]=[GW-2,GH-2];
  if(S.grid[cy][cx]===EMPTY) tilesOf(CAT).forEach(([x,y])=>{ S.grid[y][x]=EMPTY; S.grid[cy][cx]=CAT; });
  catGoHome();
  drawMorning(); hud(); autosave();
}

/* ---------- stock helpers ---------- */
// 1.45x is a real bookshop's margin. 1.75x priced a $29 title at $50.90, which is over
// the ceiling of two thirds of the cast — the shop was unsellable by arithmetic, not by play.
const autoPrice = cost => Math.round(cost*1.45) - 0.10;
function shelvedIds(){ const o=[]; Object.keys(S.slots).forEach(k=>S.slots[k].forEach(id=>o.push(id))); return o; }
function shelfCapacity(){ return tilesOf(SHELF).length*SHELF_SLOTS; }
function priceOf(id){ const s=S.stock[id]; return s.auto?autoPrice(s.cost):s.price; }
function inStock(id){ return !!(S.stock[id] && S.stock[id].copies>0); }
function stockedIds(){ return Object.keys(S.stock).map(Number).filter(inStock); }
function copiesTotal(){ return stockedIds().reduce((n,id)=>n+S.stock[id].copies,0); }
// Every order (a reorder or a new title off the van) arrives ORDER_DAYS mornings after it is placed.
const ORDER_DAYS=2;
function incomingOf(id){ return S.incoming.reduce((n,o)=>n+(o.id===id?o.n:0),0); }
function incomingIds(){ return [...new Set(S.incoming.map(o=>o.id))]; }
function incomingTotal(){ return S.incoming.reduce((n,o)=>n+o.n,0); }
function nextDueOf(id){ const d=S.incoming.filter(o=>o.id===id).map(o=>o.due); return d.length?Math.min(...d):null; }
function pendingNew(){ return incomingIds().filter(id=>!inStock(id)); }
// Every title with copies on hand belongs on a shelf. Put any that aren't into the first free slot.
function restockShelves(){
  const on=new Set(shelvedIds());
  const free=[];
  tilesOf(SHELF).forEach(([x,y])=>{ const k=key(x,y); S.slots[k]=S.slots[k]||[];
    for(let i=S.slots[k].length;i<SHELF_SLOTS;i++) free.push(k); });
  stockedIds().forEach(id=>{ if(on.has(id)||!free.length) return; S.slots[free.shift()].push(id); on.add(id); });
}
function addCopies(id,n){
  const bk=BOOK(id), st=S.stock[id];
  if(st) st.copies+=n;
  else S.stock[id]={copies:n,cost:bk.cost,price:autoPrice(bk.cost),auto:true};
}
// Grandfather's stock: a random hundred titles from the catalogue, one copy each, already shelved.
function seedStock(){
  S.stock={}; S.incoming=[];
  // dealt round the shelves like cards, so every shelf in the shop looks lived-in
  const shelves=tilesOf(SHELF).map(([x,y])=>key(x,y));
  shelves.forEach(k=>S.slots[k]=[]);
  shuffled(BOOKS).slice(0,Math.min(START_TITLES,shelfCapacity())).forEach((bk,i)=>{
    addCopies(bk.id,1); S.slots[shelves[i%shelves.length]].push(bk.id); });
}
// Can one more copy of this title be ordered? A title that isn't already on the shelves needs a free slot.
// A title already on the shelves (or on its way) has its slot; anything else needs a free one.
function hasSlotFor(id){
  if(inStock(id) || incomingOf(id)) return true;
  return stockedIds().length + pendingNew().length < shelfCapacity();
}
// Reorders: only titles the shop carries, has carried, or has on order. New titles come on the morning van.
function canOrder(id){
  return !!(S.stock[id] || incomingOf(id)) && S.cash>=BOOK(id).cost && hasSlotFor(id);
}
// Paid for now, delivered ORDER_DAYS mornings from today, whatever time of day it was ordered.
function placeOrder(id){
  const bk=BOOK(id), due=S.day+ORDER_DAYS;
  S.cash=Math.round((S.cash-bk.cost)*100)/100; S.stats.spent+=bk.cost;
  const o=S.incoming.find(o=>o.id===id && o.due===due);
  if(o) o.n++; else S.incoming.push({id,n:1,due});
  hud(); autosave();
}
function orderCopy(id){
  if(!canOrder(id)) return false;
  placeOrder(id);
  return true;
}
/* The distributor's van: from day 2, each morning it brings VAN_SIZE random titles the shop has
   never carried. Order what you want before opening (it arrives in ORDER_DAYS days, like any order);
   the rest leave with the van. */
const VAN_SIZE=8;
function rollVan(){
  S.offers=shuffled(BOOKS.filter(bk=>!S.stock[bk.id] && !incomingOf(bk.id))).slice(0,VAN_SIZE).map(bk=>bk.id);
}
function canVanBuy(id){
  return S.phase==="morning" && S.offers.includes(id) && S.cash>=BOOK(id).cost && hasSlotFor(id);
}
function vanBuy(id){
  if(!canVanBuy(id)) return false;
  placeOrder(id);
  return true;
}
// Unpacks every order due this morning onto the shelves. Returns what arrived: [{id, n}].
function deliverIncoming(){
  const due=S.incoming.filter(o=>o.due<=S.day), got={};
  S.incoming=S.incoming.filter(o=>o.due>S.day);
  due.forEach(o=>{ addCopies(o.id,o.n); got[o.id]=(got[o.id]||0)+o.n; });
  restockShelves();
  return Object.keys(got).map(Number).map(id=>({id,n:got[id]}));
}
/* Era filters for the stock take. Ancient works carry a negative (BC) year. */
const ERAS=[
  {k:"bc",   label:"Pre-AD",     lo:-1e9, hi:-1},
  {k:"early",label:"AD 0–1500",  lo:0,    hi:1500},
  {k:"c19",  label:"1501–1900",  lo:1501, hi:1900},
  {k:"c20a", label:"1901–1950",  lo:1901, hi:1950},
  {k:"c20b", label:"1951–2000",  lo:1951, hi:2000},
  {k:"now",  label:"2001–now",   lo:2001, hi:1e9},
];
function eraOf(bk){ return ERAS.find(e=>bk.year>=e.lo && bk.year<=e.hi).k; }

/* ---------- reader memory ---------- */
// A returning customer remembers what they bought here. They will not buy it again,
// and they will say so if you try.
function ownsBook(p,id){ const lib=S.library[p.key]; return !!(lib && lib[id]!==undefined); }
function ownedDay(p,id){ const lib=S.library[p.key]; return lib?lib[id]:null; }
function recordPurchase(p,id){ (S.library[p.key]=S.library[p.key]||{})[id]=S.day; }
function ownedCount(p){ const lib=S.library[p.key]; return lib?Object.keys(lib).length:0; }

const cv=$("#cv"), ctx=cv.getContext("2d");

/* Flat, outlined art: every shape is a filled vector with a navy ink outline, drawn in game units
   (TS per tile) and scaled to the stage's real device-pixel size, so it stays crisp at any width. */
const INK="#1d2340", LW=0.55;
const C={floorA:"#fbf6ec",floorB:"#f6efe1",grout:"#ece3d0",wall:"#5ab4ec",wallL:"#8fcdf3",shadow:"rgba(29,35,64,.13)",
  wood:"#f7b267",woodL:"#fff1dc",glass:"#c4e8fb",glassL:"#eef9ff",white:"#ffffff",
  yellow:"#ffc527",orange:"#f26b3a",blue:"#3aa8e8",green:"#3fbf68",greenL:"#7fd88f",cream:"#fff4e0"};
const SPINE={literary:"#f26b3a",crime:"#3d4466",scifi:"#3aa8e8",fantasy:"#3fbf68",horror:"#6c4a8c",
  romance:"#f27a9a",history:"#c98a35",biography:"#8a7ae0",nonfiction:"#22b3a3",philosophy:"#7d8597",
  poetry:"#ffc527",children:"#ff9f43",business:"#4a6fd6",ya:"#b65fd6"};

function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(Math.round((n>>16)*f),0,255),g=clamp(Math.round((n>>8&255)*f),0,255),b2=clamp(Math.round((n&255)*f),0,255);
  return "#"+((r<<16)|(g<<8)|b2).toString(16).padStart(6,"0");
}
function lum(hex){ const n=parseInt(hex.slice(1),16); return (0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255; }
function rpath(g,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function paintPath(g,fill,stroke,lw){
  if(fill){ g.fillStyle=fill; g.fill(); }
  if(stroke!==false){ g.lineWidth=lw||LW; g.strokeStyle=stroke||INK; g.lineJoin="round"; g.stroke(); }
}
function box(g,x,y,w,h,r,fill,stroke,lw){ rpath(g,x,y,w,h,r); paintPath(g,fill,stroke,lw); }
function blob(g,x,y,rx,ry,fill,stroke,lw){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); paintPath(g,fill,stroke,lw); }

/* ---------- furniture ---------- */
function drawShelf(x,y,ids){
  const X=x*TS,Y=y*TS, g=ctx;
  box(g,X+1.4,Y+2.6,TS-1.6,TS-2.4,2.2,C.shadow,false);
  box(g,X+0.6,Y+1.4,TS-1.8,TS-2.4,2.2,C.wood);
  box(g,X+2,Y+2.8,TS-4.6,TS-5.2,1,C.cream,false);
  // three rows of four spines: one spine per title shelved, coloured by genre
  for(let r=0;r<3;r++){
    const sy=Y+3+r*3.9;
    let bx=X+2.3;
    for(let i=0;i<4;i++){
      const id=ids&&ids[r*4+i];
      if(id==null) break;
      const bk=BOOK(id), rr=seeded(bk.title), base=SPINE[bk.genre]||"#7d8597";
      const w=2.2+rr()*0.4, h=2.3+rr()*0.9;
      box(g,bx,sy+3.2-h,w,h,0.4,i%2?base:shade(base,1.2),INK,0.3);

}
function drawFurn(x,y,t){

  if(t===TABLE){

    ctx.strokeStyle="rgba(29,35,64,.35)"; ctx.lineWidth=0.35; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(10.2+X,Y+0.4); ctx.quadraticCurveTo(9.5+X,Y-0.8,10.4+X,Y-1.8); ctx.stroke();

// curled up asleep; (X,Y) is the top-left of the tile it is sleeping on
function drawSleepingCat(X,Y){

// on the move, side on; (cx,fy) is the middle of its feet, dir 1 faces right and -1 left
function drawWalkingCat(cx,fy,dir,step){

const CAT_LINES=["The cat opens one eye, decides you are not dinner, and goes back to sleep.",
  "Grandfather's cat. It has outlasted three tills and a flood, and it is not moving for you.",
  "A long, slow stretch. A yawn. Back to sleep. The cat has worked here longer than you have.",
  "Regulars ask after the cat more often than they ask after you. Fair enough."];
const CAT_WALK_LINES=["The cat is doing its rounds. It does not need your help.",
  "Tail up, unhurried. The cat inspects the floor like it owns the lease. It might.",
  "The cat weaves past your ankles without looking at you once."];
const CUSHION_LINES=["The cushion is still warm. The cat is off on its rounds.",
  "An empty cushion, one orange hair. The cat will be back when it feels like it."];

/* The cat's wanderings. Not saved: it is always home on its cushion when a shop loads.
   Steps run on the game loop while nothing is paused, in every phase of the day. */
const CATW={state:"home",wait:200,x:0,y:0,px:0,py:0,path:null,pi:0,dir:1,t:0};
function catHome(){ const t=tilesOf(CAT); return t.length?t[0]:null; }
function catGoHome(){ CATW.state="home"; CATW.path=null; CATW.wait=250+((Math.random()*350)|0); }
function catPath(from,to){
  const k0=key(from[0],from[1]), prev={[k0]:null}, q=[from];
  while(q.length){
    const [x,y]=q.shift();
    if(x===to[0]&&y===to[1]) break;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy, k=key(nx,ny);
      if(nx<1||ny<1||nx>GW-2||ny>GH-2 || k in prev || isKeeperTile(nx,ny)) return;
      const t=S.grid[ny][nx]; if(t!==EMPTY && t!==CAT) return;
      prev[k]=[x,y]; q.push([nx,ny]);
    });
  }
  if(!(key(to[0],to[1]) in prev)) return null;
  const path=[]; for(let c=to; c; c=prev[key(c[0],c[1])]) path.unshift(c);
  return path;
}
// somewhere to nap: open floor, not where a browsing customer stands in front of a shelf or table,
// not the doorway, and not too far from where it is now
function catSpots(){
  const o=[], [cx,cy]=CATW.state==="home"?catHome():[CATW.x,CATW.y];
  for(let y=2;y<GH-1;y++) for(let x=1;x<GW-1;x++){
    if(S.grid[y][x]!==EMPTY || isKeeperTile(x,y)) continue;
    const above=S.grid[y-1][x];
    if(above===SHELF||above===TABLE||above===COUNTER) continue;
    if(x===doorX() && y>=GH-3) continue;
    if(Math.abs(x-cx)+Math.abs(y-cy)>6) continue;
    o.push([x,y]);
  }
  return o;
}
function catSetOff(to){
  const from=CATW.state==="home"?catHome():[CATW.x,CATW.y];
  const path=catPath(from,to);
  if(!path||path.length<2){ if(CATW.state==="home") catGoHome(); else CATW.wait=200; return; }
  CATW.path=path; CATW.pi=1; CATW.state="walk"; CATW.x=from[0]; CATW.y=from[1];
  CATW.px=from[0]*TS+8; CATW.py=from[1]*TS+12.6;
}
function catStep(){
  const home=catHome(); if(!home) return;
  // furniture put down where it was napping, or the floor changed under it: straight back to the cushion
  if(CATW.state!=="home" && (!S.grid[CATW.y]||S.grid[CATW.y][CATW.x]!==EMPTY&&S.grid[CATW.y][CATW.x]!==CAT)){ catGoHome(); return; }
  CATW.t++;
  if(CATW.state==="walk"){
    const [tx,ty]=CATW.path[CATW.pi], dx=tx*TS+8-CATW.px, dy=ty*TS+12.6-CATW.py, sp=0.7;
    if(Math.abs(dx)>0.1) CATW.dir=dx>0?1:-1;
    if(Math.abs(dx)<=sp&&Math.abs(dy)<=sp){
      CATW.px=tx*TS+8; CATW.py=ty*TS+12.6; CATW.x=tx; CATW.y=ty; CATW.pi++;
      if(CATW.pi>=CATW.path.length){
        if(tx===home[0]&&ty===home[1]) catGoHome();

      }
    } else { CATW.px+=clamp(dx,-sp,sp); CATW.py+=clamp(dy,-sp,sp); }

  }

  const spots=catSpots();
  if(spots.length) catSetOff(rnd(spots));
  else if(CATW.state==="nap") catSetOff(home); else catGoHome();

function drawFigure(g,X,Y,o){

/* ============================================================
   CUSTOMER SIM
   ============================================================ */
function pathTo(p,tx,ty){
  const start=[Math.round(p.gx),Math.round(p.gy)];
  const q=[start], prev={}, seen={}; seen[key(start[0],start[1])]=1;
  while(q.length){
    const [x,y]=q.shift();
    if(x===tx&&y===ty) break;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if(nx<1||ny<1||nx>GW-2||ny>GH-1) return;
      const t=S.grid[ny]&&S.grid[ny][nx];
      if(t===undefined) return;
      if(S.keeper && nx===S.keeper[0] && ny===S.keeper[1]) return;
      if(t!==EMPTY&&t!==DOOR&&!(nx===tx&&ny===ty)) return;
      const k=key(nx,ny); if(seen[k]) return;
      seen[k]=1; prev[k]=[x,y]; q.push([nx,ny]);
    });
  }
  const path=[]; let cur=key(tx,ty);
  if(!prev[cur]&&!(start[0]===tx&&start[1]===ty)) return null;
  while(cur){ const [cx,cy]=cur.split(",").map(Number); path.unshift([cx,cy]); const p2=prev[cur]; cur=p2?key(p2[0],p2[1]):null; }
  return path;
}
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickArchetype(){
  // Deal today's visitors from a shuffled, no-repeat deck of the whole cast, so
  // nobody is seen twice in one day and nobody walks in while their twin is
  // already browsing. Only reshuffle (excluding whoever's currently in the
  // shop) once every face has had a turn today.
  const inShopKeys=new Set(S.customers.filter(c=>!c.dead && c.state!=="leave").map(c=>c.arch.key));
  if(!S.dayCast.length) S.dayCast=shuffled(CAST.filter(a=>!inShopKeys.has(a.key)));
  const arch=S.dayCast.shift();
  S.seenToday.push(arch);
  return arch;
}
function spawnCustomer(){
  const arch=pickArchetype();
  const dx=doorX();
  const shelves=tilesOf(SHELF).concat(tilesOf(TABLE));
  const p={
    arch, key:arch.key, name:arch.name, skin:arch.skin, hair:arch.hair, shirt:arch.shirt,
    gx:dx, gy:GH-1, px:dx*TS+8, py:(GH-1)*TS+2,
    state:"walk", path:null, pi:0, moving:true, bubble:false, dir:"up",
    patMax: Math.round((430+Math.random()*220) * (tilesOf(CAFE).length?1.5:1) * (1+tilesOf(PLANT).length*0.06)),
    clues:[], probesLeft:3, done:false,
  };
  p.patience=p.patMax;
  const t = shelves.length? rnd(shelves) : [dx,3];
  p.target=[t[0], t[1]+1];
  p.path=pathTo(p,p.target[0],p.target[1]);
  S.customers.push(p);
}
function stepCustomer(p){
  if(p.state==="talking") return;
  p.patience-=1;
  if(S.tick>=S.dayLen && p.state!=="leave"){
    p.state="leave"; p.bubble=false; p.path=pathTo(p,doorX(),GH-1); p.pi=0;
    tip("Closing time. Seeing the last customers out.");
    return;
  }
  if(p.patience<=0 && p.state!=="leave"){
    p.state="leave"; p.bubble=false;
    p.path=pathTo(p,doorX(),GH-1); p.pi=0;
    if(!p.served){ S.stats.walkouts++; S.rep=clamp(S.rep-0.4,0,100); }
  }
  if(p.path && p.pi<p.path.length){
    const [tx,ty]=p.path[p.pi];
    const dx=(tx*TS+8)-p.px, dy=(ty*TS+2)-p.py;
    const sp=1.15;
    p.moving=true;
    if(Math.abs(dx)>Math.abs(dy)) p.dir=dx>0?"right":"left"; else if(Math.abs(dy)>0.5) p.dir=dy>0?"down":"up";
    if(Math.abs(dx)<=sp&&Math.abs(dy)<=sp){ p.px=tx*TS+8; p.py=ty*TS+2; p.gx=tx; p.gy=ty; p.pi++; }
    else { p.px+=clamp(dx,-sp,sp); p.py+=clamp(dy,-sp,sp); }
  } else {
    p.moving=false;
    if(p.state==="walk"){ p.state="browse"; p.bubble=true; }
    else if(p.state==="leave"){ p.dead=true; }
  }
  // passive self-serve: small chance if a shelved book fits them well
  if(p.state==="browse" && !p.served && S.tick%30===0){
    const best=bestMatchFor(p);
    if(best && best.score>=70 && Math.random()<0.32) completeSale(p,best.id,true);
  }
}
const SALE_SCORE=45;                                // score at or above this and they buy
function scoreMatch(p,id){
  const bk=BOOK(id), w=p.arch.want, price=priceOf(id);
  let s=18;
  if(w.genres.includes(bk.genre)) s+=40;
  else s-=8;                                        // wrong shelf is a miss, not a slammed door
  const moodHits=bk.moods.filter(m=>w.moods.includes(m)).length;
  s+=moodHits*16;
  if(w.avoid.includes(bk.genre)) s-=50;
  if(bk.moods.some(m=>w.avoid.includes(m))) s-=28;
  // Budget is a soft ceiling: people stretch for the right book, and the penalty scales with
  // how far past their own number you are, not with flat dollars.
  if(price<=w.max) s+=16;
  else s-= Math.min(42, Math.round(((price-w.max)/w.max)*95));
  const fair=autoPrice(bk.cost);
  if(price>fair*1.3) s-=10;
  if(price<fair*0.9) s+=5;
  s+=(p.clues?p.clues.length:0)*3;                  // asking earns you the benefit of the doubt
  return Math.round(clamp(s,0,100));
}
function bestMatchFor(p){
  let best=null;
  shelvedIds().forEach(id=>{ if(!S.stock[id]||S.stock[id].copies<=0) return;
    if(ownsBook(p,id)) return;                       // already on their shelf at home
    const sc=scoreMatch(p,id); if(!best||sc>best.score) best={id,score:sc}; });
  return best;
}
// Returns true if the sale actually went through. It can fail late: the last copy may have
// gone to a passive browser while this conversation was open.
function completeSale(p,id,passive){
  const st=S.stock[id]; if(!st||st.copies<=0) return false;
  if(ownsBook(p,id)) return false;                // they already own this one
  const price=priceOf(id);
  st.copies--; S.cash=Math.round((S.cash+price)*100)/100; S.stats.rev+=price; S.stats.served++;
  recordPurchase(p,id);
  p.paid=price;
  S.soldEver[id]=(S.soldEver[id]||0)+1;
  p.served=true; p.bubble=false;
  const sc=scoreMatch(p,id);
  if(sc>=85 && !passive){ S.stats.delighted++; S.rep=clamp(S.rep+4.5,0,100); }
  else S.rep=clamp(S.rep+(passive?1.0:2.4),0,100);
  if(st.copies===0){ Object.keys(S.slots).forEach(k=>{ S.slots[k]=S.slots[k].filter(x=>x!==id); }); }
  p.state="leave"; p.path=pathTo(p,doorX(),GH-1); p.pi=0;
  log(p.name+" paid "+rm(price)+" for "+BOOK(id).title);
  S.sales.push({name:p.name,id,price,restocked:false});
  return true;
}
function log(t){ S.history.unshift(t); if(S.history.length>40)S.history.pop(); }

/* ============================================================
   GAME LOOP
   ============================================================ */
let last=0, paused=false;     // paused: the title screen or the menu is up
let lockModal=false;          // the prelude and naming screens can't be dismissed by tapping outside
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-last<66) { render(); return; }
  last=ts;
  if(S.phase==="open" && !S.talking && !paused){
    S.tick++;
    while(S.spawnQueue.length && S.spawnQueue[0]<=S.tick){ S.spawnQueue.shift(); spawnCustomer(); }
    S.customers.forEach(stepCustomer);
    S.customers=S.customers.filter(c=>!c.dead);
    if(S.tick>=S.dayLen && S.customers.length===0) endDay();
    else if(S.tick%10===0) drawOpenPanel();
  }
  if(!paused && !S.talking) catStep();
  render();
}

/* ---------- phases ---------- */
function startDay(){
  S.offers=[];                                       // the van leaves when the shop opens
  S.phase="open"; S.tick=0; S.customers=[]; S.spawnQueue=[]; S.seenToday=[]; S.dayCast=[]; S.sales=[];
  S.stats={rev:0,spent:S.stats.spent,served:0,delighted:0,missed:0,walkouts:0};
  const n=rollFootfall();
  S.footfall=n;
  for(let i=0;i<n;i++) S.spawnQueue.push(Math.round(40 + (S.dayLen-260)*(i/n) + Math.random()*40));
  S.spawnQueue.sort((a,b)=>a-b);
  tip("Tap a customer to talk. The bar over their head is patience.");
  paint();
}
function endDay(){
  S.phase="evening";
  const r=rent();
  S.cash=Math.round((S.cash-r)*100)/100;
  paint(); autosave();
}
function nextDay(){
  S.day++; S.phase="morning"; S.stats.spent=0; S.tab="stock"; S.sales=[];
  const got=deliverIncoming();
  rollVan();
  paint(); autosave();
  tip((got.length?"Delivery in: "+got.length+" "+(got.length===1?"title":"titles")+" restocked. ":"")+
    (S.offers.length?"The van is outside with "+S.offers.length+" new titles — see the Stock tab.":"No new titles on the van today."));
  if(got.length) deliveryNotice(got);
}

function coverCanvas(bk,w,h){
  // flat cover: solid genre colour, a simple outlined motif, bold title set at the top
  const W=120,H=180, c=document.createElement("canvas"); c.width=W; c.height=H;
  const g=c.getContext("2d"), r=seeded(bk.title+bk.author);
  const base=SPINE[bk.genre]||"#7d8597", dark=lum(base)<0.62, fg=dark?"#ffffff":INK;
  g.fillStyle=base; g.fillRect(0,0,W,H);
  const style=(r()*4)|0, ac=lum(base)<0.5?shade(base,1.45):shade(base,0.82);
  g.lineWidth=2.4; g.strokeStyle=INK; g.lineJoin="round";
  if(style===0){ blob(g,60,118,24+r()*10,24+r()*10,C.yellow,INK,2.4); }
  else if(style===1){ g.beginPath(); g.moveTo(0,H); g.lineTo(W,88); g.lineTo(W,H); g.closePath(); paintPath(g,ac,INK,2.4); }
  else if(style===2){ for(let i=0;i<3;i++) box(g,-4,98+i*20,W+8,9,4.5,ac,INK,2.4); }
  else { for(let i=0;i<6;i++) blob(g,18+r()*84,92+r()*60,5+r()*7,5+r()*7,i%2?C.white:ac,INK,2); }
  g.fillStyle="rgba(0,0,0,.12)"; g.fillRect(0,0,7,H);
  const words=bk.title.toUpperCase().split(" "); let lines, fs=bk.title.length>22?14:bk.title.length>12?17:21;
  // step the size down until the title fits in four lines, so long titles never lose a word
  for(;;fs--){
    lines=[]; let line="";
    g.font="700 "+fs+"px "+getComputedStyle(document.body).fontFamily;
    words.forEach(wd=>{ const t=line?line+" "+wd:wd; if(g.measureText(t).width>W-24 && line){ lines.push(line); line=wd; } else line=t; });
    lines.push(line);
    if(lines.length<=4 || fs<=10) break;
  }
  g.fillStyle=fg; g.textBaseline="top";
  lines.slice(0,4).forEach((l,i)=>g.fillText(l,14,14+i*(fs+2)));
  g.font="500 10px "+getComputedStyle(document.body).fontFamily;
  g.fillStyle=fg; g.globalAlpha=.85;
  g.fillText(bk.author.toUpperCase().slice(0,20),14,14+Math.min(lines.length,4)*(fs+2)+4);
  g.globalAlpha=1;
  c.style.width=w+"px"; c.style.height=h+"px";
  return c;
}
function starRow(bk){
  const rt=ratingFor(bk);
  return "<span class='stars'>"+starsFor(rt.avg)+"</span><small>"+rt.avg.toFixed(1)+"</small>";
}
function bookCard(bk,extraHTML,onClick){

      P.appendChild(tr);

  }

  if(S.tab==="price"){

      const q=el("div","qty");
      const sp=el("div","stepper");
      sp.appendChild(el("span",null,"Price"));
      const m=el("button",null,"−"), p2=el("button",null,"+");
      m.disabled=p2.disabled=st.auto;
      m.onclick=e=>{e.stopPropagation();st.price=Math.max(st.cost,st.price-2);drawMorning();autosave();};
      p2.onclick=e=>{e.stopPropagation();st.price+=2;drawMorning();autosave();};
      const mid=el("div","row"); mid.style.gap="2px";
      mid.appendChild(m); mid.appendChild(el("b",null,rm(priceOf(id)))); mid.appendChild(p2);
      sp.appendChild(mid); q.appendChild(sp);

      auto.onclick=e=>{e.stopPropagation(); st.auto=!st.auto; if(!st.auto)st.price=autoPrice(st.cost); drawMorning(); autosave();};
      q.appendChild(auto);

    const L=el("div","list");

    const nt=nextTier();
    if(nt){
      const locked=S.rep<nt.rep;
      row(ICON.grow,"Upgrade to "+nt.name,"Bigger floor, more foot traffic · rent "+rm(nt.rent)+"/day"+(locked?" · needs rep "+nt.rep:""),
        locked?"Locked":rm(nt.cost),locked,locked||S.cash<nt.cost,()=>upgradeSpace());
    }
    const icons={[SHELF]:ICON.shelf,[TABLE]:ICON.table,[PLANT]:ICON.plant,[CAFE]:ICON.cafe};
    Object.keys(FURN).forEach(k=>{
      const f=FURN[k], lv=f.lvl||1, locked=level()<lv;
      row(icons[k],f.name,f.desc+(locked?" · needs level "+lv:""),locked?"Locked":rm(f.cost),locked,locked||S.cash<f.cost,
        ()=>{ S.placing=+k; tip("Tap an empty floor tile to place the "+f.name+"."); });
    });
    P.appendChild(L);
    if(!nt) P.appendChild(el("p",null,"This is the biggest space on the row. Nowhere further to expand."));
    P.appendChild(el("p",null,"Coffee Corner is the cafe expansion. It does not sell drinks yet — it buys you time, which in this shop is the same thing."));

    P.appendChild(el("h3",null,"This shop"));
    P.appendChild(el("p",null,saveNote()+" There is nothing to press — the shop is written down each morning and each evening. Close the tab mid-day and you pick that morning up again. Start over is in the menu, top right."));
  }

  setAction("Open the shop",()=>{
    if(!shelvedIds().length){tip("You have nothing on the shelves.");return;}
    startDay();
  });
  tip(shopLabel()+" · day "+S.day+", morning. Stock, price, then open.");
}
/* ---------- stock take ----------
   Reachable at any time from the clipboard in the top bar. The trading clock stops while it is open. */
const STK={tab:"inv",genre:"all",era:"all",prevPaused:false,open:false};
function stockTake(){
  if(S.talking || titleOn()) return;
  const sh=$("#sheet");
  if(!STK.open) STK.prevPaused=paused;
  STK.open=true; paused=true;
  $("#modal").classList.add("on");
  sh.innerHTML="";
  sh.appendChild(el("h2",null,"Stock take")).style.marginBottom="4px";
  const cap=shelfCapacity(), used=shelvedIds().length, inc=incomingTotal();
  sh.appendChild(el("p",null,"<b>"+used+"/"+cap+"</b> titles shelved · <b>"+copiesTotal()+"</b> copies · till "+rm(S.cash)+
    (inc?" · <b>"+inc+"</b> on order":"")+(S.phase==="open"?" · the clock is stopped":"")));

  const seg=el("div","seg");
  [["inv","Inventory"],["order","Order stock"]].forEach(([k,l])=>{
    const b2=el("button",STK.tab===k?"on":"",l); b2.onclick=()=>{ STK.tab=k; stockTake(); }; seg.appendChild(b2);
  });
  sh.appendChild(seg);

  const chipRow=(opts,cur,set)=>{
    const r=el("div","chips");
    opts.forEach(([k,l])=>{ const c=el("button","chip"+(cur===k?" on":""),l); c.onclick=()=>{ set(k); stockTake(); }; r.appendChild(c); });
    sh.appendChild(r);
  };
  sh.appendChild(el("h3",null,"Genre")).style.marginTop="4px";
  chipRow([["all","All"]].concat(Object.keys(GENRE_LABEL).map(g=>[g,GENRE_LABEL[g]])),STK.genre,k=>STK.genre=k);

  chipRow([["all","All"]].concat(ERAS.map(e=>[e.k,e.label])),STK.era,k=>STK.era=k);

  const pool = STK.tab==="inv"
    ? BOOKS.filter(bk=>inStock(bk.id)||incomingOf(bk.id))
    : BOOKS.filter(bk=>S.stock[bk.id]||incomingOf(bk.id));
  const ids=pool.filter(bk=>(STK.genre==="all"||bk.genre===STK.genre)&&(STK.era==="all"||eraOf(bk)===STK.era))
    .sort((a,b2)=>a.title.localeCompare(b2.title)).map(bk=>bk.id);
  sh.appendChild(el("div","count",ids.length+" "+(ids.length===1?"title":"titles")+
    (STK.tab==="inv"?" in the shop":" you carry or have carried")));

    (S.phase==="morning"&&S.offers.length?" — it's outside now, on the Stock tab.":".")));

  const list=el("div","stlist");
  ids.forEach(id=>{
    const bk=BOOK(id), st=S.stock[id], have=inStock(id)?st.copies:0, inc2=incomingOf(id);
    const status=(have?have+" on the shelf":"none on the shelf")+(inc2?" · "+inc2+" arriving day "+nextDueOf(id):"");
    const c=bookCard(bk,"<div class='cost' style='margin-top:4px'>"+status+" · sells at "+rm(have?priceOf(id):autoPrice(bk.cost))+"</div>",

    cta.appendChild(btn);
    meta.appendChild(cta);
    list.appendChild(c);
  });
  if(!ids.length) list.appendChild(el("div","empty","Nothing here for that genre and era."));
  sh.appendChild(list);
  if(stockedIds().length+pendingNew().length>=cap)
    sh.appendChild(el("p",null,"Every shelf slot is spoken for. You can still order more copies of titles you carry; for new titles, buy another shelf in SHOP.")).style.marginTop="10px";
  sh.appendChild(ghost("Back to the shop",closeStockTake));

const SHOP_OPEN_MIN=10*60, SHOP_CLOSE_MIN=19*60;       // 10:00am - 7:00pm, ticks down over the 60s trading window
function shopClock(){
  const frac=clamp(S.tick/S.dayLen,0,1);
  const totalMin=Math.floor(SHOP_OPEN_MIN + (SHOP_CLOSE_MIN-SHOP_OPEN_MIN)*frac);
  const h24=Math.floor(totalMin/60), m=totalMin%60;
  const ampm=h24<12?"AM":"PM", h12=((h24+11)%12)+1;
  return h12+":"+String(m).padStart(2,"0")+" "+ampm;
}
function ringHTML(frac){
  const r=19, c=2*Math.PI*r, pct=Math.round(100*clamp(frac,0,1));
  const col=frac>.5?"var(--green)":frac>.25?"var(--yellow)":"var(--orange)";
  return '<svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="'+r+'" fill="none" stroke="#e7e8f0" stroke-width="4"/>'+
    '<circle cx="23" cy="23" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+
    (c*pct/100).toFixed(1)+' '+c.toFixed(1)+'"/></svg><b>'+pct+'%</b>';
}

  inShop.forEach(p=>{

    const inner=el("div","inner");
    inner.appendChild(avatarImg(Object.assign({key:p.key},figureOf(p))));
    const m=el("div","meta");

    c.appendChild(inner);
    if(!p.served){ const btn=el("button","go btn-y","→"); btn.setAttribute("aria-label","Talk to "+p.name);
      btn.onclick=()=>talk(p); c.appendChild(btn); c.style.cursor="pointer"; c.onclick=()=>talk(p); }

/* ---------- conversation ---------- */

function primary(label,fn){ const b2=el("button","choice primary",label); b2.onclick=fn; return b2; }
function ghost(label,fn){ const b2=el("button","choice ghost",label); b2.onclick=fn; return b2; }
function renderTalk(p,convo){
  const sh=$("#sheet"); sh.innerHTML="";

  }

      p.clues.push(pr.reveal);
      renderTalk(p, convo.concat([{who:"me",text:pr.q},{who:"npc",text:pr.a}]));
    };

/* Recommending: every book on the shelves in the genres this customer reads is pulled out.
   The player puts up to six of them in front of the customer. Each one that genuinely suits
   them is an even-odds "I'd buy that" — so four that fit means about two they'd actually buy —
   but they only ever take one: the best of those. If none suits them, they leave it. */
const SHORTLIST_MAX=6, BUY_CHANCE=0.5;
function pulledFor(p){
  const want=p.arch.want.genres;
  return shelvedIds().filter(id=>inStock(id) && !ownsBook(p,id) && want.includes(BOOK(id).genre))
    .sort((a,b2)=>BOOK(a).title.localeCompare(BOOK(b2).title));
}
function renderPick(p,convo){
  const sh=$("#sheet"); sh.innerHTML="";
  p.shortlist=(p.shortlist||[]).filter(inStock);
  sh.appendChild(speaker(p,"Choose up to "+SHORTLIST_MAX+" books to show them"));
  if(p.clues.length){ const cl=el("div","clues"); p.clues.forEach(c=>cl.appendChild(el("span","tag g",c))); sh.appendChild(cl); }
  const ids=pulledFor(p);
  const genres=p.arch.want.genres.map(g=>GENRE_LABEL[g]||g).join(", ");
  sh.appendChild(el("p",null,"Pulled from your shelves: <b>"+ids.length+"</b> "+(ids.length===1?"book":"books")+" in "+genres+
    ". Tap a book to add it to the pile; tap Read to look it up first."));
  const count=el("h3",null,""); sh.appendChild(count);
  const list=el("div");
  const go=primary("",()=>resolve(p,p.shortlist.slice(),convo));
  const sync=()=>{
    const n=p.shortlist.length;
    count.textContent="On the counter · "+n+" / "+SHORTLIST_MAX;
    go.textContent=n?"Show "+p.name+" "+(n===1?"this book":"these "+n+" books"):"Pick at least one book";
    go.disabled=!n;
    list.querySelectorAll(".sl").forEach(row=>{
      const id=+row.dataset.id, on=p.shortlist.includes(id);
      row.classList.toggle("on",on);
      row.classList.toggle("off",!on && n>=SHORTLIST_MAX);
      row.querySelector(".check").classList.toggle("on",on);
    });
  };
  ids.forEach(id=>{
    const bk=BOOK(id);
    const row=el("div","sl"); row.dataset.id=id;
    row.appendChild(coverCanvas(bk,40,60));
    const m=el("div","meta");
    m.appendChild(el("div","t",bk.title));
    m.appendChild(el("div","a",bk.author+" · "+yearText(bk.year)));
    const tr=el("div","tagrow"); tr.style.marginTop="3px";
    tr.appendChild(el("span","tag b",GENRE_LABEL[bk.genre]||bk.genre));
    bk.moods.forEach(m2=>tr.appendChild(el("span","tag",m2)));
    m.appendChild(tr);
    m.appendChild(el("div","price",rm(priceOf(id)))).style.fontSize="13px";
    row.appendChild(m);
    const rd=el("button","read","Read");
    rd.onclick=e=>{ e.stopPropagation(); renderConfirm(p,id,convo); };
    row.appendChild(rd);
    row.appendChild(el("span","check","✓"));
    row.onclick=()=>{
      const i=p.shortlist.indexOf(id);
      if(i>=0) p.shortlist.splice(i,1);
      else if(p.shortlist.length<SHORTLIST_MAX) p.shortlist.push(id);
      sync();
    };
    list.appendChild(row);
  });
  sh.appendChild(list);
  if(!ids.length) sh.appendChild(el("div","empty","Nothing on your shelves in "+genres+" that "+p.name+
    " doesn't already own.<br>Order some in from the stock take."));
  const all=shelvedIds().filter(inStock), owned=all.filter(id=>ownsBook(p,id));
  if(owned.length){
    sh.appendChild(el("h3",null,"Already bought here"));
    const cl=el("div","tagrow"); cl.style.marginBottom="10px";
    owned.forEach(id=>cl.appendChild(el("span","tag r",BOOK(id).title+" · day "+ownedDay(p,id))));
    sh.appendChild(cl);
  }
  if(ids.length) sh.appendChild(go);
  sh.appendChild(ghost("← Keep talking",()=>renderTalk(p,convo)));
  sync();
}
function bookHead(bk,price,yearLabel){
  const head=el("div","bookhead");
  head.appendChild(coverCanvas(bk,96,144));
  const hm=el("div");
  hm.appendChild(el("div","t",bk.title));
  hm.appendChild(el("div","a",bk.author+(yearLabel?"":" · "+yearText(bk.year))));
  if(yearLabel) hm.appendChild(el("div","a","First published "+yearText(bk.year)));
  hm.appendChild(el("div",null,starRow(bk)));
  hm.appendChild(el("div","price",rm(price)));
  head.appendChild(hm);
  return head;
}
function bookFacts(bk){
  const rt=ratingFor(bk);
  const f=el("div","facts");
  [["Rating",rt.avg.toFixed(1)],["Genre",GENRE_LABEL[bk.genre]||bk.genre],["Pace",bk.pace]].forEach(([k,v])=>
    f.appendChild(el("div","stat","<span>"+k+"</span><b>"+v+"</b>")));
  return f;
}
function bookBody(sh,bk){
  sh.appendChild(bookFacts(bk));

function renderConfirm(p,id,convo){
  const bk=BOOK(id), sh=$("#sheet"); sh.innerHTML="";
  sh.appendChild(el("h3",null,"Before you put it on the counter")).style.marginTop="0";
  sh.appendChild(bookHead(bk,priceOf(id)));
  bookBody(sh,bk);
  if(p.clues.length){
    sh.appendChild(el("h3",null,"What "+p.name+" told you"));
    const cl=el("div","clues"); p.clues.forEach(c=>cl.appendChild(el("span","tag g",c))); sh.appendChild(cl);
  }
  p.shortlist=p.shortlist||[];
  const on=p.shortlist.includes(id), full=p.shortlist.length>=SHORTLIST_MAX;
  const add=primary(on?"Take it off the pile":full?"The pile is full ("+SHORTLIST_MAX+")":"Add to the pile",()=>{
    const i=p.shortlist.indexOf(id);
    if(i>=0) p.shortlist.splice(i,1); else if(!full) p.shortlist.push(id);
    renderPick(p,convo);
  });
  add.disabled=!on&&full;
  sh.appendChild(add);
  sh.appendChild(ghost("← Back to the books",()=>renderPick(p,convo)));
  sh.scrollTop=0;
}
const MAYBE_LINES=[
  "These are lovely. I'm not buying today — but I'll remember this pile.",
  "You've found exactly my sort of thing. Not today, though. Next time.",
  "Mm, tempting. Let me think about it. I'll come back.",
  "Good choices. I've spent too much this week already, I'm afraid.",
];
function resolve(p,ids,convo){
  ids=ids.filter(id=>inStock(id) && !ownsBook(p,id));
  const sh=$("#sheet"); sh.innerHTML="";
  sh.appendChild(speaker(p));
  if(!ids.length){
    sh.appendChild(el("div","say","Those seem to have gone while we were talking."));
    sh.appendChild(primary("← Back to the books",()=>renderPick(p,convo)));
    return;
  }
  sh.appendChild(el("div","say me",ids.length===1 ? "\""+BOOK(ids[0]).title+"\" — I think this is you."
    : "I've pulled "+ids.length+" for you: "+ids.map(id=>BOOK(id).title).join(", ")+"."));
  const scored=ids.map(id=>({id,score:scoreMatch(p,id)})).sort((a,b2)=>b2.score-a.score);
  const best=scored[0], fit=best.score>=SALE_SCORE;
  const keen=scored.filter(x=>x.score>=SALE_SCORE && Math.random()<BUY_CHANCE);
  const bought=keen.length>0, pick=bought?keen[0]:best;
  const v=el("div","verdict "+(bought?"good":"bad"));
  if(bought){
    sh.appendChild(el("div","say",p.arch.yes+"\n\nI'll take \""+BOOK(pick.id).title+"\"."));
    v.textContent=(pick.score>=85?"Perfect match · ":"Sold · ")+BOOK(pick.id).title;
    sh.appendChild(v);
    const pay=el("div","say");
    pay.textContent = completeSale(p,pick.id,false)
      ? "Pays "+rm(p.paid)+". Till: "+rm(S.cash)+"."
      : "— but that was the last copy, and it just walked out the door. Nothing to sell them.";
    sh.appendChild(pay);
  } else if(fit){
    // a good pile that didn't sell: every coin came up tails. No reputation lost — they liked what they saw.
    sh.appendChild(el("div","say",rnd(MAYBE_LINES)));
    v.textContent="Not today · they liked \""+BOOK(best.id).title+"\"";
    sh.appendChild(v);
    sh.appendChild(el("p",null,"Each book that suited them was a coin toss, and none came up. More good fits on the pile means better odds."));
    p.served=true; p.state="leave"; p.bubble=false; p.path=pathTo(p,doorX(),GH-1); p.pi=0;
    S.stats.missed++;
    log(p.name+" liked "+BOOK(best.id).title+" but didn't buy");
  } else {
    sh.appendChild(el("div","say",p.arch.no));
    v.textContent="No sale · nothing on the pile suited them";
    sh.appendChild(v);
    const w=p.arch.want;
    sh.appendChild(el("p",null,"They wanted: "+w.genres.map(g=>GENRE_LABEL[g]||g).join(", ")+
      " · "+w.moods.join(", ")+" · under "+rm(w.max)+
      (w.avoid.length?" · never "+w.avoid.join(", "):"")));
    p.patience=Math.min(p.patience,60); p.state="browse"; S.rep=clamp(S.rep-0.3,0,100);
    S.stats.missed++;
  }
  p.shortlist=[];
  sh.appendChild(primary("Continue",endTalk));
  hud();
}
function closeModal(){ $("#modal").classList.remove("on"); }
// Ends a conversation from anywhere in it: the customer goes back to browsing (or, if the
// conversation already settled things, carries on out of the door).

/* ---------- evening ---------- */
function drawEvening(){
  const P=$("#panel"); P.innerHTML="";
  P.appendChild(el("h2",null,"Day "+S.day+" · Closed"));
  const st=S.stats, r=rent(), net=st.rev-st.spent-r;
  const L=el("div","ledgerbox");
  [["Takings",st.rev,"pos"],["Stock bought",-st.spent,"neg"],["Rent",-r,"neg"]]
    .forEach(([l,v,c])=>L.appendChild(el("div","ledger "+c,"<span>"+l+"</span><b>"+(v<0?"-":"")+rm(Math.abs(v))+"</b>")));
  P.appendChild(L);
  P.appendChild(el("div","total"+(net<0?" neg":""),"<span>Net</span><b>"+(net<0?"-":"")+rm(Math.abs(net))+"</b>"));
  const f=el("div","facts"); f.style.margin="0"; f.style.background="var(--card)";
  [["Came in",S.footfall],["Served",st.served],["Delighted",st.delighted],["Walked out",st.walkouts]].forEach(([k,v])=>f.appendChild(el("div","stat","<span>"+k+"</span><b>"+v+"</b>")));
  P.appendChild(f);
  if(st.walkouts>2) P.appendChild(el("p",null,"You are losing people to impatience. A Coffee Corner or more palms would buy you time."));
  P.appendChild(el("p",null,"Reputation "+Math.round(S.rep)+"/100 · level "+level()+
    (level()<3?" · next unlock at "+(level()===1?18:45):" · everything unlocked")));
  if(S.cash<0) P.appendChild(el("p",null,"You are in the red. Mr Rossi next door is carrying you on credit — you won't close, but you cannot restock until you're positive."));
  P.appendChild(el("h3",null,"Sales"));
  if(!S.sales.length) P.appendChild(el("div","empty","Nobody bought anything today."));
  else {
    P.appendChild(el("p",null,"Restock what sold: each copy costs trade price now and arrives on day "+(S.day+ORDER_DAYS)+", before opening."));
    const L=el("div","list");
    S.sales.forEach(sale=>{
      const bk=BOOK(sale.id), li=el("div","li");
      li.appendChild(coverCanvas(bk,30,45)).classList.add("mini");
      const m=el("div","meta"); m.appendChild(el("div","t",bk.title));
      const left=inStock(sale.id)?S.stock[sale.id].copies:0;
      m.appendChild(el("div","a",sale.name+" paid "+rm(sale.price)+" · "+(left?left+" left":"sold out")));
      li.appendChild(m);
      const btn=el("button","btn-sm"+(sale.restocked?"":" btn-y"),sale.restocked?"Ordered ✓":"Restock · "+rm(bk.cost));

      li.appendChild(btn);

    });
    P.appendChild(L);
  }
  setAction("Next morning",()=>{ S.history=[]; nextDay(); });

}

function paint(){
  hud();

  else if(S.phase==="open") drawOpenPanel();

}

/* ---------- input ---------- */
cv.addEventListener("click",e=>{
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*GW);
  const y=Math.floor((e.clientY-r.top)/r.height*GH);
  if(S.placing!=null && S.phase==="morning"){
    if(S.grid[y]&&S.grid[y][x]===EMPTY&&!isKeeperTile(x,y)){
      const f=FURN[S.placing];
      if(S.cash>=f.cost){ S.cash-=f.cost; S.stats.spent+=f.cost; S.grid[y][x]=S.placing;
        if(f.slots) S.slots[key(x,y)]=[];
        if(S.placing===SHELF) restockShelves(); }
    }
    S.placing=null; tip("Placed."); paint(); autosave(); return;
  }
  if(CATW.state!=="home" && Math.hypot(CATW.px-(x*TS+8), CATW.py-4-(y*TS+8))<11){
    tip(rnd(CATW.state==="walk"?CAT_WALK_LINES:CAT_LINES)); return; }
  if(S.grid[y]&&S.grid[y][x]===CAT){ tip(rnd(CATW.state==="home"?CAT_LINES:CUSHION_LINES)); return; }
  if(S.phase==="open"){
    let hit=null,bd=99;
    S.customers.forEach(p=>{ if(p.served||p.state==="leave")return;
      const d=Math.hypot(p.px-(x*TS+8), p.py-(y*TS+6)); if(d<bd&&d<18){bd=d;hit=p;} });
    if(hit){ talk(hit); return; }
  }
  const t=S.grid[y]&&S.grid[y][x];
  if(t===SHELF||t===TABLE){
    const ids=S.slots[key(x,y)]||[];
    if(ids.length){ const sh=$("#sheet"); sh.innerHTML=""; $("#modal").classList.add("on");
      sh.appendChild(el("h3",null,"This shelf")).style.marginTop="0";
      ids.forEach(id=>sh.appendChild(bookCard(BOOK(id),
        "<div class='price' style='margin-top:4px'>"+rm(priceOf(id))+" · "+(S.stock[id]?S.stock[id].copies:0)+" left</div>",
        ()=>openBook(id))));
      sh.appendChild(ghost("Close",closeModal));
    }
  }
});

// A button that silently does nothing is undiagnosable from a report. If a script error

/* ============================================================
   MUSIC
   One looping track ("Paperback Afternoon"). Browsers refuse to start audio
   before the player has touched the page, so it starts on the first tap or key
   rather than on load. The on/off choice is a per-browser preference, kept out
   of the save on purpose — it belongs to the device, not the shop.
   ============================================================ */
const MUSIC_KEY="cornerbooks.music";
const bgm=$("#bgm"), musicBtn=$("#music");
const MUSIC_ICON={
  on:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  off:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M3 3l18 18"/></svg>'
};
let musicOn=true;
try{ musicOn=localStorage.getItem(MUSIC_KEY)!=="off"; }catch(e){}
bgm.volume=0.35;
function playMusic(){ if(musicOn && !document.hidden) bgm.play().catch(()=>{}); }
function paintMusic(){
  musicBtn.innerHTML=musicOn?MUSIC_ICON.on:MUSIC_ICON.off;
  musicBtn.classList.toggle("off",!musicOn);
  musicBtn.setAttribute("aria-pressed",String(musicOn));
  musicBtn.setAttribute("aria-label",musicOn?"Music on":"Music off");

musicBtn.addEventListener("click",()=>{

// the first touch anywhere is what the browser counts as permission to play
function firstGesture(){
  document.removeEventListener("pointerdown",firstGesture,true);
  document.removeEventListener("keydown",firstGesture,true);
