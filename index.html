<title>Kedai Buku</title>
<style>
  :root{
    --ink:#3a2a1a; --ink-dim:#7a6248; --bg:#fdf3de; --panel:#fff6e4;
    --panel-2:#ffffff; --line:#e8b04b; --line-soft:#f0d9a8; --gold:#ff9d1f; --gold-deep:#c9720a;
    --green:#4caf3c; --green-deep:#2e7d22; --red:#e8534a; --red-deep:#b8362f; --blue:#3b8fd6;
    --shadow:rgba(120,70,10,.25);
    --pix:"Press Start 2P", ui-monospace, monospace;
    --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:12px; line-height:1.6;
    overscroll-behavior:none; user-select:none; -webkit-user-select:none;
  }
  #wrap{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);}

  /* ---- HUD ---- */
  #hud{display:flex;gap:5px;padding:8px;background:var(--gold);border-bottom:3px solid var(--gold-deep);flex:none;}
  .stat{flex:1;background:var(--panel-2);border:2px solid var(--gold-deep);border-radius:8px;padding:5px 3px;text-align:center;box-shadow:0 2px 0 var(--shadow);}
  .stat b{display:block;font-family:var(--pix);color:var(--gold-deep);font-size:9px;margin-top:5px;}
  .stat span{font-family:var(--pix);color:var(--ink-dim);font-size:6px;}

  /* ---- canvas ---- */
  #stage{background:#2a2016;flex:none;width:100%;max-width:min(460px,calc(52vh * 4 / 3));margin:0 auto;position:relative;border-bottom:3px solid var(--gold-deep);}
  canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;}
  #signText{position:absolute;left:6%;right:6%;top:0;text-align:center;font-family:var(--pix);
    color:#ffd772;text-shadow:1px 1px 0 #6b3f0a,-1px 1px 0 #6b3f0a,1px -1px 0 #6b3f0a,-1px -1px 0 #6b3f0a,0 2px 0 #4a2a06;
    line-height:1; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:clip;
    pointer-events:none; transform:translateY(-50%);}
  #tip{background:var(--panel-2);padding:7px 9px;font-size:11px;color:var(--gold-deep);flex:none;font-weight:600;
    border-bottom:2px solid var(--line-soft);min-height:28px;}

  /* ---- panel ---- */
  #panel{flex:1;background:var(--bg);padding:9px;}
  #action{padding:8px;background:var(--panel);border-bottom:2px solid var(--line-soft);flex:none;}
  #action:empty{display:none;}
  h2{font-family:var(--pix);font-size:10px;margin:0 0 10px;color:var(--gold-deep);line-height:1.6;}
  h3{font-family:var(--pix);font-size:7px;margin:12px 0 6px;color:var(--ink-dim);letter-spacing:1px;text-transform:uppercase;}
  p{margin:0 0 8px;color:var(--ink-dim);font-size:12px;line-height:1.65;}

  .tabs{display:flex;gap:4px;margin-bottom:9px;}
  .tab{flex:1;padding:8px 2px;background:var(--panel-2);border:2px solid var(--line-soft);border-radius:8px;color:var(--ink-dim);
    text-align:center;font-family:var(--pix);font-size:7px;cursor:pointer;}
  .tab.on{background:var(--gold);color:#5a3400;border-color:var(--gold-deep);}

  button{font-family:var(--pix);font-size:8px;line-height:1.7;cursor:pointer;border:2px solid var(--line-soft);border-radius:8px;
    background:var(--panel-2);color:var(--ink);padding:8px 9px;box-shadow:0 2px 0 var(--shadow);}
  button:active{transform:translateY(2px);box-shadow:none;}
  button:disabled{opacity:.35;cursor:default;box-shadow:none;}
  .btn-go{background:var(--gold);color:#5a3400;border-color:var(--gold-deep);width:100%;padding:14px;font-size:10px;}
  .btn-sm{padding:6px 8px;font-size:7px;}
  .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}

  .card{background:var(--panel-2);border:2px solid var(--line-soft);border-radius:10px;padding:7px;margin-bottom:6px;display:flex;gap:9px;align-items:flex-start;box-shadow:0 2px 0 var(--shadow);}
  .card canvas{width:36px;height:54px;flex:none;border:1px solid #000;border-radius:3px;image-rendering:pixelated;}
  .card .meta{flex:1;min-width:0;}
  .t{font-family:var(--pix);font-size:8px;line-height:1.7;color:var(--ink);}
  .a{font-size:11px;color:var(--ink-dim);margin-top:4px;}
  .tagrow{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px;}
  .tag{font-size:10px;padding:2px 6px;border-radius:10px;background:#ffe9c2;border:1px solid var(--line);color:var(--gold-deep);}
  .tag.g{color:var(--green-deep);border-color:var(--green);background:#e3f5df;}
  .tag.b{color:#1f5a8a;border-color:var(--blue);background:#e2f1fb;}
  .tag.r{color:var(--red-deep);border-color:var(--red);background:#fbe4e2;}
  .price{font-family:var(--pix);color:var(--gold-deep);font-size:8px;}
  .cost{font-size:11px;color:var(--ink-dim);}

  .empty{text-align:center;color:var(--ink-dim);padding:20px 8px;font-size:12px;line-height:1.9;}
  .bar{height:6px;background:#f0dcae;border-radius:4px;border:1px solid var(--line-soft);margin-top:5px;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--green);}

  /* ---- modal ---- */
  #modal{position:fixed;inset:0;background:rgba(60,35,5,.55);display:none;z-index:50;align-items:flex-end;justify-content:center;}
  #modal.on{display:flex;}
  #sheet{width:100%;max-width:460px;max-height:92vh;overflow-y:auto;background:var(--panel);
    border-top:4px solid var(--gold);border-radius:16px 16px 0 0;padding:14px;}
  .speaker{font-family:var(--pix);color:var(--gold-deep);font-size:9px;margin-bottom:8px;line-height:1.7;}
  .say{background:var(--panel-2);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:9px 10px;font-size:13px;
    line-height:1.65;color:var(--ink);margin-bottom:8px;white-space:pre-line;}
  .say.me{border-left-color:var(--blue);color:var(--ink-dim);font-style:italic;}
  .keeper-portrait{display:block;width:100%;border-radius:10px;margin-bottom:10px;border:2px solid var(--gold);}
  .choice{display:block;width:100%;text-align:left;margin-bottom:5px;font-family:var(--sans);font-size:12px;padding:10px;}
  .clues{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px;}
  .pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px;}
  .pick .bk{background:var(--panel-2);border:2px solid var(--line-soft);border-radius:8px;padding:5px;text-align:center;cursor:pointer;}
  .pick .bk canvas{width:100%;height:auto;aspect-ratio:2/3;border:1px solid #000;border-radius:3px;image-rendering:pixelated;}
  .pick .bk div{font-size:10px;margin-top:4px;color:var(--ink-dim);line-height:1.4;}
  .verdict{text-align:center;padding:10px;font-family:var(--pix);font-size:9px;margin:8px 0;border-radius:8px;border:2px solid var(--line-soft);}
  .verdict.good{color:var(--green-deep);border-color:var(--green);background:#e3f5df;}
  .verdict.bad{color:var(--red-deep);border-color:var(--red);background:#fbe4e2;}

  .bookhead{display:flex;gap:11px;margin-bottom:10px;}
  .bookhead canvas{width:80px;height:120px;flex:none;border:2px solid #000;border-radius:5px;image-rendering:pixelated;}
  .review{border-top:1px solid var(--line-soft);padding:8px 0;font-size:12px;color:var(--ink-dim);line-height:1.6;}
  .review b{font-family:var(--pix);font-size:7px;color:var(--gold-deep);display:block;margin-bottom:5px;}
  .stars{color:var(--gold-deep);letter-spacing:2px;font-family:var(--sans);font-size:11px;}
  .buy{background:var(--green);color:#0e3308;border-color:var(--green-deep);width:100%;padding:12px;margin-top:10px;font-size:9px;line-height:1.7;}
  .note{font-size:10px;color:var(--ink-dim);line-height:1.6;margin-top:9px;border-top:1px solid var(--line-soft);padding-top:7px;}

  .ledger{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line-soft);}
  .ledger b{font-family:var(--pix);font-size:8px;color:var(--gold-deep);}
  .ledger.neg b{color:var(--red-deep);}
  .ledger.pos b{color:var(--green-deep);}
  .lock{opacity:.45;}
  .namerow{display:flex;align-items:center;gap:8px;margin:10px 0 4px;}
  .namerow span{font-family:var(--pix);font-size:9px;color:var(--gold-deep);white-space:nowrap;}
  #shopName{flex:1;min-width:0;font-family:var(--sans);font-size:15px;padding:9px 10px;border-radius:8px;
    background:var(--panel-2);border:2px solid var(--gold);color:var(--ink);}
  #shopName:focus{outline:2px solid var(--gold);outline-offset:1px;}
  /* Press Start 2P is far wider than the fallback - never let it break the layout */
  .t,button,h2,h3,.speaker,.verdict,.stat b{overflow-wrap:anywhere;}
</style>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<div id="wrap">
  <div id="hud">
    <div class="stat"><span>DAY</span><b id="hDay">1</b></div>
    <div class="stat"><span>CASH</span><b id="hCash">1500</b></div>
    <div class="stat"><span>REP</span><b id="hRep">0</b></div>
    <div class="stat"><span>PHASE</span><b id="hPhase">SETUP</b></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="signText"></div></div>
  <div id="tip">Tap OPEN when your shelves are ready.</div>
  <div id="action"></div>
  <div id="panel"></div>
</div>

<div id="modal"><div id="sheet"></div></div>

function ratingFor(bk){ const r=RATINGS[bk.title]; return r?{avg:r[0],count:r[1]}:{avg:4.0,count:5000}; }
function starsFor(avg){ const full=clamp(Math.round(avg),0,5); return "★".repeat(full)+"☆".repeat(5-full); }
function fmtCount(n){
  if(n>=1000000) return (n/1000000).toFixed(n>=10000000?0:1)+"M";
  if(n>=1000) return Math.round(n/1000)+"K";
  return String(n);
}
function ratingBlock(bk){
  const rt=ratingFor(bk);
  const d=el("div","review");
  d.appendChild(el("b",null,"<span class='stars'>"+starsFor(rt.avg)+"</span>  "+rt.avg.toFixed(2)+" / 5"));
  d.appendChild(el("span",null,fmtCount(rt.count)+" ratings from real readers, aggregated across major book-review sites."));
  return d;
}

/* ---------- shop grid ---------- */
let GW=9, GH=7; const TS=16, PX=4, ART=2;   // PX: device px per game px (scene detail); ART: the older sheets' own scale
const EMPTY=0, WALL=1, SHELF=2, COUNTER=3, TABLE=4, PLANT=5, CAFE=6, DOOR=7;
const FURN={
  [SHELF]:{name:"Shelf",cost:120,slots:3,desc:"Holds 3 titles"},
  [TABLE]:{name:"Display Table",cost:200,slots:1,desc:"Featured title, +40% notice",lvl:2},
  [PLANT]:{name:"Potted Palm",cost:60,slots:0,desc:"+ambience, slower exits"},
  [CAFE]:{name:"Kopi Corner",cost:900,slots:0,desc:"+50% patience, all customers",lvl:3},
};

/* Space tiers. Rent is tied to floor size, not reputation, and starts low:
   growth is a choice the player makes and pays for once, not a tax on doing well. */
const SIZE_TIERS=[
  {name:"Corner Kiosk",  gw:9,  gh:7,  rent:30,  cost:0,    rep:0},
  {name:"Shoplot Unit",  gw:12, gh:9,  rent:70,  cost:1200, rep:10},
  {name:"Double Lot",    gw:16, gh:11, rent:130, cost:3200, rep:30},
];

const S={
  phase:"morning", day:1, cash:1500, rep:0, tier:0,
  grid:[], slots:{},          // tileKey -> [bookId,...]
  stock:{},                   // bookId -> {copies, price, auto, cost}
  offers:[], customers:[], tick:0, dayLen:900,
  spawnQueue:[], talking:null, placing:null,
  stats:{rev:0,spent:0,served:0,delighted:0,missed:0,walkouts:0},
  history:[], soldEver:{}, tab:"stock", featured:null,
  seen:{}, tutorial:true, shopName:"", keeper:null, seenToday:[], dayCast:[],
};

function key(x,y){return x+","+y;}
function doorX(){ return Math.floor(GW/2); }
function initGrid(preserve){
  const oldGrid=preserve?S.grid:null, oldSlots=preserve?S.slots:null;
  const prevGW=preserve?oldGrid[0].length:0, prevGH=preserve?oldGrid.length:0;
  S.grid=[];
  for(let y=0;y<GH;y++){ const row=[]; for(let x=0;x<GW;x++){
    let t=EMPTY;
    const border = y===0||x===0||x===GW-1||y===GH-1;
    if(border) t=WALL;
    if(y===GH-1 && x===doorX()) t=DOOR;
    if(preserve && y<prevGH && x<prevGW){
      const was=oldGrid[y][x];
      const wasBorder = y===0||x===0||x===prevGW-1||y===prevGH-1;
      if(!border) t = wasBorder ? EMPTY : was;   // old wall/door now interior -> floor; old furniture kept
    }
    row.push(t);
  } S.grid.push(row);}
  if(preserve){
    const newSlots={};
    Object.keys(oldSlots).forEach(k=>{
      const [x,y]=k.split(",").map(Number);
      if(x<GW-1 && y<GH-1 && (S.grid[y][x]===SHELF||S.grid[y][x]===TABLE)) newSlots[k]=oldSlots[k];
    });
    S.slots=newSlots;
  } else {
    S.slots={};
    const dx=doorX();
    [[2,2],[3,2]].forEach(([x,y])=>{S.grid[y][x]=SHELF; S.slots[key(x,y)]=[];});
    S.grid[2][dx]=COUNTER; S.grid[2][1]=PLANT;
    S.keeper=[dx,1];   // you, standing behind the counter
  }
  resizeStage();
}
function resizeStage(){
  const cv2=$("#cv"); if(!cv2) return;
  cv2.width=GW*TS*PX; cv2.height=GH*TS*PX;             // four device px per game px, so the art can carry quarter-pixel detail
  const g=cv2.getContext("2d"); g.setTransform(PX,0,0,PX,0,0); g.imageSmoothingEnabled=false;
  buildBackdrop();
  $("#stage").style.maxWidth="min(460px, calc(52vh * "+GW+" / "+GH+"))";
  const sign=$("#signText");
  if(sign){ sign.style.top=(7/(GH*TS)*100)+"%"; sign.style.fontSize=Math.max(6,Math.round(GW*TS/22))+"px"; }
}
function tilesOf(type){const o=[];for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(S.grid[y][x]===type)o.push([x,y]);return o;}
function level(){ return S.rep>=45?3 : S.rep>=18?2 : 1; }
function rent(){ return SIZE_TIERS[S.tier].rent; }
function maxCustomers(){ return 3 + S.tier*2 + level() + Math.floor(S.rep/12); }
function nextTier(){ return S.tier<SIZE_TIERS.length-1 ? SIZE_TIERS[S.tier+1] : null; }
function upgradeSpace(){
  const nt=nextTier(); if(!nt) return;
  if(S.cash<nt.cost || S.rep<nt.rep) return;
  S.cash-=nt.cost; S.stats.spent+=nt.cost; S.tier++;
  GW=nt.gw; GH=nt.gh;
  initGrid(true);
  drawMorning(); hud();
}

/* ---------- stock helpers ---------- */
const autoPrice = cost => Math.round(cost*1.75) - 0.10;
function shelvedIds(){ const o=[]; Object.keys(S.slots).forEach(k=>S.slots[k].forEach(id=>o.push(id))); return o; }
function shelfCapacity(){ return tilesOf(SHELF).length*3; }
function priceOf(id){ const s=S.stock[id]; return s.auto?autoPrice(s.cost):s.price; }
function rollOffers(){
  const have=Object.keys(S.stock).map(Number);
  const pool=BOOKS.filter(x=>!have.includes(x.id)||S.stock[x.id].copies===0);
  const r=[]; const used={};
  const n=Math.min(8,pool.length);
  while(r.length<n){ const p=pool[(Math.random()*pool.length)|0]; if(used[p.id])continue; used[p.id]=1; r.push(p.id); }
  S.offers=r;
}

/* ============================================================
   RENDERING
   ============================================================ */
const cv=$("#cv"), ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=false;
let G=ctx;                     // surface px() paints on — swapped while the static backdrop is baked

/* The shop is authored at quarter-game-pixel detail: PX device pixels cover one game pixel,
   so U is the smallest mark that still lands exactly on a device pixel. */
const U=1/PX;
const q=v=>Math.round(v*PX)/PX;                       // snap to the device pixel grid

const C={
  floorA:"#d9ccb1", floorB:"#d3c5a9", floorC:"#cec0a3", grout:"#b3a488",
  wall:"#e7dcc4", wallD:"#dbcfb5", wallL:"#f2e9d6", cornice:"#f4ecda",
  dado:"#4d7a63", dadoD:"#3b6250", dadoL:"#639380", cap:"#8a6a45", capL:"#a5855e",
  wood:"#8b5a35", woodD:"#6b4426", woodL:"#a97448", woodX:"#4e3220",
  glass:"#8fb8c9", glassD:"#6d99ad", street:"#c9b489",
  brass:"#e0b455", door:"#7a4c2c", shadow:"rgba(40,26,12,.22)", soft:"rgba(40,26,12,.13)",
};
const SPINE={literary:"#8a4a4a",crime:"#3a3a4a",scifi:"#2f5f7a",fantasy:"#4a6a35",horror:"#2a2028",
  romance:"#a8556e",history:"#7a6030",biography:"#6a5a8a",nonfiction:"#356a6a",philosophy:"#5a4a3a",
  poetry:"#8a6a3a",children:"#c98a35",business:"#405a70",ya:"#7a4a8a"};

function px(x,y,w,h,c){G.fillStyle=c;G.fillRect(x,y,w,h);}
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=clamp(Math.round((n>>16)*f),0,255),g=clamp(Math.round((n>>8&255)*f),0,255),b2=clamp(Math.round((n&255)*f),0,255);
  return "#"+((r<<16)|(g<<8)|b2).toString(16).padStart(6,"0");
}

/* ---------- static backdrop (floor, walls, shopfront) ----------
   Painted once per floor plan into an offscreen canvas at full device resolution, then blitted
   each frame. Baking it is what makes the fine tile-and-plaster detail affordable. */
let bgCv=null;
function buildBackdrop(){
  bgCv=document.createElement("canvas");
  bgCv.width=GW*TS*PX; bgCv.height=GH*TS*PX;
  const g=bgCv.getContext("2d");
  g.setTransform(PX,0,0,PX,0,0); g.imageSmoothingEnabled=false;
  const prev=G; G=g;
  drawFloor(); drawWalls(); drawFrontage();
  G=prev;
}

const FT=4;                                            // floor tile: 4 game px, sixteen to a grid square
function drawFloor(){
  const W=GW*TS, H=GH*TS;
  for(let ty=0;ty<H/FT;ty++)for(let tx=0;tx<W/FT;tx++){
    const X=tx*FT, Y=ty*FT, rr=seeded("f"+tx+"_"+ty);
    const base=[C.floorA,C.floorB,C.floorC][(rr()*3)|0];
    px(X,Y,FT,FT,base);
    px(X,Y,FT,U,shade(base,1.05));                     // sheen on the lit edges
    px(X,Y,U,FT,shade(base,1.03));
    for(let i=0;i<5;i++)                               // terrazzo flecks
      px(X+U+((rr()*14)|0)*U, Y+U+((rr()*14)|0)*U, U,U,
        ["#c2b397","#eae1ca","#b0a084","#cfc1a4","#e2d8bf"][(rr()*5)|0]);
    px(X,Y+FT-U,FT,U,C.grout);                         // grout
    px(X+FT-U,Y,U,FT,C.grout);
  }
  // ambient occlusion where the floor meets the walls
  for(let i=0;i<10;i++){
    const a=(0.13-i*0.013).toFixed(3);
    px(0,TS+i*U,W,U,"rgba(46,30,14,"+a+")");
    px(4+i*U,TS,U,H-TS,"rgba(46,30,14,"+a+")");
    px(W-4-(i+1)*U,TS,U,H-TS,"rgba(46,30,14,"+a+")");
  }
}

function drawWalls(){
  const W=GW*TS;
  px(0,0,W,TS,C.wall);
  for(let y=0;y<TS;y++)for(let x=0;x<W;x++){            // plaster: broad blotches, then a fine tooth
    const rr=seeded("w"+x+"_"+y);
    if(rr()<0.22) px(x+((rr()*3)|0)*U, y+((rr()*3)|0)*U, 1,1, rr()<0.5?C.wallL:C.wallD);
    if(rr()<0.30) px(x+((rr()*4)|0)*U, y+((rr()*4)|0)*U, U,U, rr()<0.5?"#f1e8d6":"#dbcfb6");
  }
  for(let i=0;i<9;i++)                                  // light falls off towards the floor
    px(0,TS-4.5-i*0.75,W,0.75,"rgba(70,48,22,"+(0.015*i).toFixed(3)+")");
  px(0,0,W,0.5,C.cornice); px(0,0.5,W,0.5,C.wallL);     // cornice
  px(0,1,W,U,"rgba(70,48,22,.18)");
  // signboard: painted timber, bevelled, screwed to the wall (the name is a crisp HTML overlay)
  const bx=TS+4, bw=W-2*TS-8;
  px(bx+0.5,11.25,bw,0.75,"rgba(60,40,18,.3)");         // drop shadow
  px(bx,2,bw,9.5,C.woodX);                              // outer frame
  px(bx+0.5,2.5,bw-1,8.5,"#7d4a12");
  for(let i=1.5;i<bw-2.5;i+=1.5)                        // grain
    px(bx+1+i,3.25,U,7,seeded("sb"+i)()<0.5?"#8f5a1c":"#6f410f");
  px(bx+1,3,bw-2,7.5,"#8a5a1a");
  px(bx+1,3,bw-2,U,"#b8822f"); px(bx+1,3,U,7.5,"#a87526");
  px(bx+1,10.25,bw-2,U,"#54300a"); px(bx+bw-1.25,3,U,7.5,"#5f370c");
  px(bx+1.75,3.75,bw-3.5,U,"rgba(224,180,85,.45)");     // gilt hairline
  px(bx+1.75,9.75,bw-3.5,U,"rgba(224,180,85,.35)");
  for(const sx of [bx+1.75,bx+bw-2.5]) for(const sy of [4.5,8.75]){
    px(sx,sy,0.5,0.5,C.brass); px(sx,sy+0.25,0.5,U,"#8a6320");
  }
  // dado: a timber cap rail over tongue-and-groove boarding
  px(0,TS-4.75,W,0.5,C.capL); px(0,TS-4.25,W,0.75,C.cap); px(0,TS-3.5,W,U,shade(C.cap,.6));
  px(0,TS-3.25,W,3.25,C.dado);
  for(let x=0;x<W;x+=2){                                // bead between each board
    px(x,TS-3.25,U,2.75,shade(C.dadoD,.82)); px(x+U,TS-3.25,U,2.75,C.dadoL);
  }
  px(0,TS-3.25,W,U,shade(C.dadoD,.7));
  px(0,TS-0.75,W,0.75,shade(C.dadoD,.8));               // skirting
  px(0,TS-0.75,W,U,C.dadoL); px(0,TS-U,W,U,"rgba(30,20,8,.4)");
  // side walls
  const H=GH*TS;
  px(0,TS,4,H-TS,C.dado); px(W-4,TS,4,H-TS,C.dado);
  for(let y=TS;y<H;y+=2){                               // the same boarding, seen edge-on
    px(0.5,y,3.25,U,shade(C.dadoD,.82)); px(0.5,y+U,3.25,U,C.dadoL);
    px(W-3.75,y,3.25,U,shade(C.dadoD,.82)); px(W-3.75,y+U,3.25,U,C.dadoL);
  }
  px(0,TS,U,H-TS,C.dadoL); px(W-U,TS,U,H-TS,shade(C.dadoD,.72));
  px(3.75,TS,U,H-TS,"rgba(30,20,8,.35)"); px(W-4,TS,U,H-TS,"rgba(30,20,8,.35)");
}

function drawFrontage(){
  const W=GW*TS, dx=doorX(), fy=(GH-1)*TS+5;
  px(0,fy-1,W,1,C.soft);                                // the shopfront's shadow falls back into the room
  px(0,fy,W,0.5,"#8a5a34"); px(0,fy+0.5,W,1.25,"#5e3a22");   // head beam
  for(let x=0;x<W;x+=2) px(x+((seeded("hb"+x)()*4)|0)*U,fy+0.75,U,0.75,"#4d2f1b");
  px(0,fy+1.75,W,U,"#36200f");
  px(0,fy+2,W,TS-7,"#4a2e1a");                          // frame behind the glazing
  for(let x=1;x<GW-1;x++){
    if(x===dx) continue;
    const X=x*TS;
    px(X+1,fy+2.5,TS-2,1.75,"#a9cbd6");                 // sky
    px(X+1,fy+4.25,TS-2,3.5,C.glass);                   // buildings across the street
    px(X+2,fy+5,2.5,2.75,shade(C.glass,.88));
    px(X+9,fy+4.75,3,3,shade(C.glass,.93));
    px(X+1,fy+7.75,TS-2,1.25,C.street);                 // pavement
    px(X+1,fy+9,TS-2,0.5,shade(C.street,.8));
    for(let i=0;i<9;i++)                                // two thin reflection streaks
      px(X+2+i*0.5, fy+7.75-i*0.5, 0.5,U,"rgba(255,255,255,.34)");
    for(let i=0;i<5;i++)
      px(X+6.5+i*0.5, fy+7.25-i*0.5, 0.5,U,"rgba(255,255,255,.22)");
    px(X+1,fy+2.5,TS-2,U,"rgba(255,255,255,.5)");       // glass edges
    px(X+1,fy+2.5,U,7,"rgba(255,255,255,.28)");
    px(X+TS-1.25,fy+2.5,U,7,C.glassD);
    px(X+1,fy+9.5,TS-2,U,C.glassD);
    px(X,fy+2,1,8,"#5e3a22"); px(X,fy+2,U,8,"#7d5130");  // mullion
    px(X+TS-1,fy+2,1,8,"#5e3a22"); px(X+TS-1,fy+2,U,8,"#7d5130");
  }
  // door
  const DX=dx*TS;
  px(DX-0.5,fy+1,TS+1,TS-6,"#33200f");
  px(DX,fy+1.5,TS,TS-7,C.door);
  px(DX,fy+1.5,TS,U,"#9a6438"); px(DX,fy+1.5,U,TS-7,"#9a6438");
  px(DX+TS-U,fy+1.5,U,TS-7,"#4e2f18");
  px(DX+1,fy+2.5,TS-2,5.25,"#a8ccd8");                  // glazed upper panel
  px(DX+1,fy+2.5,TS-2,1.25,"#d3e8ef");
  px(DX+1,fy+6.75,TS-2,1,C.street);
  px(DX+7.5,fy+2.5,U,5.25,C.door);                      // glazing bar
  px(DX+1,fy+5,U,2.75,C.door);
  px(DX+1,fy+2.5,TS-2,U,"rgba(255,255,255,.5)");
  px(DX+1,fy+7.75,TS-2,U,"#6d99ad");
  px(DX+1.5,fy+8.5,TS-3,2,"#6b4023");                   // lower panel

/* ---------- shelving ---------- */
function drawShelf(x,y,ids){
  const X=x*TS, Y=y*TS;
  px(X+0.5,Y+2.5,TS-1,TS-2,C.shadow);                 // cast shadow on the floor
  px(X,Y+1,TS,TS-1,C.woodD);                          // carcass
  px(X+1.25,Y+2.5,TS-2.5,TS-3.5,shade(C.woodD,.78));  // back panel in shadow
  px(X+1.25,Y+2.5,TS-2.5,0.5,shade(C.woodD,.6));      // cornice casts onto it
  for(let i=0;i<9;i++)                                // grain on the side stiles
    px(X+0.25+ (i%2?TS-1.5:0), Y+2.5+i*1.4, U, 1, shade(C.wood, i%2?.82:1.12));
  px(X,Y+1,TS,0.5,C.woodL);                           // cornice
  px(X,Y+0.75,TS,0.25,shade(C.woodL,1.2));
  px(X,Y+1.5,TS,U,C.woodX);
  px(X,Y+1,1.25,TS-1,C.wood); px(X+TS-1.25,Y+1,1.25,TS-1,C.wood);
  px(X,Y+1,U,TS-1,C.woodL); px(X+TS-U,Y+1,U,TS-1,C.woodX);

  const rowTop=[2.75,7.25,11.75], rowH=3.5;
  for(let r=0;r<3;r++){
    const sy=Y+rowTop[r];
    const id=ids&&ids[r];
    if(id!=null){
      const bk=BOOK(id), base=SPINE[bk.genre]||"#7a5a4a", rr=seeded(bk.title+"#"+x+y+r);
      let bx=X+1.5;
      while(bx<X+TS-2){
        const w=q(0.75+rr()*0.75), h=q(rowH-0.5-rr()*1), lean=rr()<0.08 && bx>X+TS-6;
        if(bx+w>X+TS-1.5) break;
        const col=shade(base, 0.8+rr()*0.5);
        const top=sy+rowH-h;
        px(bx,top,w,h,col);
        px(bx,top,U,h,shade(col,1.3));                // lit edge of the spine
        px(bx+w-U,top,U,h,shade(col,.66));
        px(bx,top,w,U,shade(col,1.18));               // head of the block
        if(rr()<0.45) px(bx+U,top+h*0.3,w-2*U,U,C.brass);   // gilt band
        if(rr()<0.3)  px(bx+U,top+h*0.55,w-2*U,U,shade(col,1.45));
        if(lean) px(bx+w,sy+rowH-1,q(1.25),1,shade(base,.9));
        bx+=w+U;
      }
    }
    px(X+1.25,sy+rowH,TS-2.5,0.5,C.wood);             // shelf board
    px(X+1.25,sy+rowH,TS-2.5,U,C.woodL);
    px(X+1.25,sy+rowH+0.5,TS-2.5,U,C.woodX);
    px(X+1.25,sy+rowH+0.75,TS-2.5,U,"rgba(40,26,12,.2)");
  }
  px(X,Y+TS-0.75,TS,0.75,C.woodX);                    // plinth
  px(X+0.25,Y+TS-0.5,TS-0.5,U,"rgba(0,0,0,.25)");
}

    px(X+3,Y+2,2,0.75,"#4a3527"); px(X+5.75,Y+1.75,0.75,1,"#8d949c");
    px(X+3.25,Y+3.75,1.5,0.5,"#6b4a2e");              // spout drip tray
    px(X+7.5,Y+2.75,1.75,1.25,"#f2ead8");             // cups
    px(X+7.5,Y+2.75,1.75,U,"#ffffff"); px(X+7.5,Y+3.75,1.75,U,"#cdc4b0");
    px(X+9.25,Y+3,0.4,0.6,"#e4dcc8");
    px(X+10,Y+2.75,1.75,1.25,"#f2ead8"); px(X+10,Y+2.75,1.75,U,"#ffffff");
    px(X+10,Y+3.75,1.75,U,"#cdc4b0");

    px(X+13,Y+3,1.75,U,"#b8a070");
  }
}

const npcReady=b=>b.img.complete&&b.img.naturalWidth&&b.mk.complete&&b.mk.naturalWidth;
const hexRGB=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const lumOf=(r,g,b)=>(0.299*r+0.587*g+0.114*b)/255;
const npcTints=new Map();
function npcBodyOf(p){ if(NPC_BODY_OF[p.key]!=null) return NPC_BODY_OF[p.key]; let h=0; for(const ch of String(p.key||p.name)) h=(h*31+ch.charCodeAt(0))|0; return Math.abs(h)%NPC_BODIES.length; }
function npcSheet(p){
  const bi=npcBodyOf(p), body=NPC_BODIES[bi]; if(!npcReady(body)) return null;
  const ck=bi+"|"+p.hair+"|"+p.skin+"|"+p.shirt;
  let cv3=npcTints.get(ck); if(cv3) return cv3;
  const W=body.img.naturalWidth, H=body.img.naturalHeight;

  const g=cv3.getContext("2d"); g.drawImage(body.img,0,0);

  const id=g.getImageData(0,0,W,H), d=id.data, m=mg.getImageData(0,0,W,H).data;

  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<40||m[i+3]<128) continue;
    const k=m[i]>200?0:m[i+1]>200?1:m[i+2]>200?2:-1;

}

}

/* ============================================================
   CUSTOMER SIM
   ============================================================ */
function pathTo(p,tx,ty){
  const start=[Math.round(p.gx),Math.round(p.gy)];
  const q=[start], prev={}, seen={}; seen[key(start[0],start[1])]=1;
  while(q.length){
    const [x,y]=q.shift();
    if(x===tx&&y===ty) break;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if(nx<1||ny<1||nx>GW-2||ny>GH-1) return;
      const t=S.grid[ny]&&S.grid[ny][nx];
      if(t===undefined) return;
      if(S.keeper && nx===S.keeper[0] && ny===S.keeper[1]) return;
      if(t!==EMPTY&&t!==DOOR&&!(nx===tx&&ny===ty)) return;
      const k=key(nx,ny); if(seen[k]) return;
      seen[k]=1; prev[k]=[x,y]; q.push([nx,ny]);
    });
  }
  const path=[]; let cur=key(tx,ty);
  if(!prev[cur]&&!(start[0]===tx&&start[1]===ty)) return null;
  while(cur){ const [cx,cy]=cur.split(",").map(Number); path.unshift([cx,cy]); const p2=prev[cur]; cur=p2?key(p2[0],p2[1]):null; }
  return path;
}
function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pickArchetype(){
  // Deal today's visitors from a shuffled, no-repeat deck of the whole cast, so
  // nobody is seen twice in one day and nobody walks in while their twin is
  // already browsing. Only reshuffle (excluding whoever's currently in the
  // shop) once every face has had a turn today.
  const inShopKeys=new Set(S.customers.filter(c=>!c.dead && c.state!=="leave").map(c=>c.arch.key));
  if(!S.dayCast.length) S.dayCast=shuffled(CAST.filter(a=>!inShopKeys.has(a.key)));
  const arch=S.dayCast.shift();
  S.seenToday.push(arch);
  return arch;
}
function spawnCustomer(){
  const arch=pickArchetype();
  const dx=doorX();
  const shelves=tilesOf(SHELF).concat(tilesOf(TABLE));
  const p={
    arch, key:arch.key, name:arch.name, skin:arch.skin, hair:arch.hair, shirt:arch.shirt,
    gx:dx, gy:GH-1, px:dx*TS+8, py:(GH-1)*TS+2,
    state:"walk", path:null, pi:0, moving:true, bubble:false, dir:"up",
    patMax: Math.round((430+Math.random()*220) * (tilesOf(CAFE).length?1.5:1) * (1+tilesOf(PLANT).length*0.06)),
    clues:[], probesLeft:3, done:false,
  };
  p.patience=p.patMax;
  const t = shelves.length? rnd(shelves) : [dx,3];
  p.target=[t[0], t[1]+1];
  p.path=pathTo(p,p.target[0],p.target[1]);
  S.customers.push(p);
}
function stepCustomer(p){
  if(p.state==="talking") return;
  p.patience-=1;
  if(S.tick>=S.dayLen && p.state!=="leave"){
    p.state="leave"; p.bubble=false; p.path=pathTo(p,doorX(),GH-1); p.pi=0;
    tip("Closing time. Seeing the last customers out.");
    return;
  }
  if(p.patience<=0 && p.state!=="leave"){
    p.state="leave"; p.bubble=false;
    p.path=pathTo(p,doorX(),GH-1); p.pi=0;
    if(!p.served){ S.stats.walkouts++; S.rep=clamp(S.rep-0.4,0,100); }
  }
  if(p.path && p.pi<p.path.length){
    const [tx,ty]=p.path[p.pi];
    const dx=(tx*TS+8)-p.px, dy=(ty*TS+2)-p.py;
    const sp=1.15;
    p.moving=true;
    if(Math.abs(dx)>Math.abs(dy)) p.dir=dx>0?"right":"left"; else if(Math.abs(dy)>0.5) p.dir=dy>0?"down":"up";
    if(Math.abs(dx)<=sp&&Math.abs(dy)<=sp){ p.px=tx*TS+8; p.py=ty*TS+2; p.gx=tx; p.gy=ty; p.pi++; }
    else { p.px+=clamp(dx,-sp,sp); p.py+=clamp(dy,-sp,sp); }
  } else {
    p.moving=false;
    if(p.state==="walk"){ p.state="browse"; p.bubble=true; }
    else if(p.state==="leave"){ p.dead=true; }
  }
  // passive self-serve: small chance if a shelved book fits them well
  if(p.state==="browse" && !p.served && S.tick%40===0){
    const best=bestMatchFor(p);
    if(best && best.score>=78 && Math.random()<0.22) completeSale(p,best.id,true);
  }
}
function scoreMatch(p,id){
  const bk=BOOK(id), w=p.arch.want, price=priceOf(id);
  let s=10;
  if(w.genres.includes(bk.genre)) s+=42;
  else s-=14;
  const moodHits=bk.moods.filter(m=>w.moods.includes(m)).length;
  s+=moodHits*16;
  if(w.avoid.includes(bk.genre)) s-=55;
  if(bk.moods.some(m=>w.avoid.includes(m))) s-=30;
  if(price<=w.max) s+=18; else s-= Math.min(45,(price-w.max)*3.2);
  const fair=autoPrice(BOOK(id).cost);
  if(price>fair*1.25) s-=12;
  if(price<fair*0.85) s+=4;
  return Math.round(clamp(s,0,100));
}
function bestMatchFor(p){
  let best=null;
  shelvedIds().forEach(id=>{ if(!S.stock[id]||S.stock[id].copies<=0) return;
    const sc=scoreMatch(p,id); if(!best||sc>best.score) best={id,score:sc}; });
  return best;
}
function completeSale(p,id,passive){
  const st=S.stock[id]; if(!st||st.copies<=0) return;
  const price=priceOf(id);
  st.copies--; S.cash+=price; S.stats.rev+=price; S.stats.served++;
  S.soldEver[id]=(S.soldEver[id]||0)+1;
  p.served=true; p.bubble=false;
  const sc=scoreMatch(p,id);
  if(sc>=85 && !passive){ S.stats.delighted++; S.rep=clamp(S.rep+4.5,0,100); }
  else S.rep=clamp(S.rep+(passive?1.0:2.4),0,100);
  if(st.copies===0){ Object.keys(S.slots).forEach(k=>{ S.slots[k]=S.slots[k].filter(x=>x!==id); }); }
  p.state="leave"; p.path=pathTo(p,doorX(),GH-1); p.pi=0;
  log((passive?"":"")+p.name+" bought "+BOOK(id).title+" — "+rm(price));
}
function log(t){ S.history.unshift(t); if(S.history.length>40)S.history.pop(); }

/* ============================================================
   GAME LOOP
   ============================================================ */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(ts-last<66) { render(); return; }
  last=ts;
  if(S.phase==="open" && !S.talking){
    S.tick++;
    while(S.spawnQueue.length && S.spawnQueue[0]<=S.tick){ S.spawnQueue.shift(); spawnCustomer(); }
    S.customers.forEach(stepCustomer);
    S.customers=S.customers.filter(c=>!c.dead);
    if(S.tick>=S.dayLen && S.customers.length===0) endDay();
    else if(S.tick%10===0) drawOpenPanel();
  }
  render();
}

/* ---------- phases ---------- */
function startDay(){
  S.phase="open"; S.tick=0; S.customers=[]; S.spawnQueue=[]; S.seenToday=[]; S.dayCast=[];
  S.stats={rev:0,spent:S.stats.spent,served:0,delighted:0,missed:0,walkouts:0};
  const n=maxCustomers();
  for(let i=0;i<n;i++) S.spawnQueue.push(Math.round(40 + (S.dayLen-260)*(i/n) + Math.random()*40));
  S.spawnQueue.sort((a,b)=>a-b);
  tip("Tap a customer to talk. The bar over their head is patience.");
  paint();
}
function endDay(){
  S.phase="evening";
  const r=rent();
  S.cash-=r;
  paint();
}
function nextDay(){
  S.day++; S.phase="morning"; S.stats.spent=0; S.tab="stock";
  rollOffers(); paint();
}

function coverCanvas(bk,w,h){
  const c=document.createElement("canvas"); c.width=48;c.height=72;
  const g=c.getContext("2d"); g.imageSmoothingEnabled=false;
  const r=seeded(bk.title+bk.author);
  const base=SPINE[bk.genre]||"#7a5a4a";
  const bg=shade(base, .7+r()*.5);
  g.fillStyle=bg; g.fillRect(0,0,48,72);
  const style=(r()*4)|0, ac=shade(base,1.9);
  g.fillStyle=ac;
  if(style===0){ for(let i=0;i<3;i++) g.fillRect(0,12+i*15,48,4); }
  else if(style===1){ g.beginPath(); g.arc(24,30,11+((r()*6)|0),0,7); g.fill(); }
  else if(style===2){ g.beginPath(); g.moveTo(0,72);g.lineTo(48,24);g.lineTo(48,72);g.closePath();g.fill(); }
  else { for(let i=0;i<7;i++) g.fillRect(5+((r()*36)|0),9+((r()*46)|0),4+((r()*7)|0),4); }
  g.fillStyle="rgba(0,0,0,.35)"; g.fillRect(0,0,4,72);
  g.fillStyle="#f4ead6";
  g.font="5px monospace";
  const words=bk.title.split(" "); const lines=[]; let line="";
  words.forEach(wd=>{ if((line+wd).length>10){ lines.push(line); line=wd+" "; } else line+=wd+" "; });
  lines.push(line);
  let ly=66-lines.length*6;
  g.fillStyle="rgba(0,0,0,.45)"; g.fillRect(0,ly-6,48,lines.length*6+10);
  g.fillStyle="#f4ead6";
  lines.forEach(l=>{ g.fillText(l.trim(),5,ly); ly+=6; });
  g.fillStyle="rgba(255,255,255,.6)"; g.font="4px monospace";
  g.fillText(bk.author.split(" ").slice(-1)[0].toUpperCase(),5,ly+1);
  c.style.width=w+"px"; c.style.height=h+"px";
  return c;
}
function bookCard(bk,extraHTML,onClick){
  const c=el("div","card");
  c.appendChild(coverCanvas(bk,34,48));
  const m=el("div","meta");
  m.appendChild(el("div","t",bk.title));

  const tr=el("div","tagrow");

  bk.moods.slice(0,2).forEach(m2=>tr.appendChild(el("span","tag",m2)));
  m.appendChild(tr);
  if(extraHTML) m.appendChild(el("div",null,extraHTML));
  c.appendChild(m);

  return c;
}

    const ids=Object.keys(S.stock).map(Number).filter(id=>S.stock[id].copies>0);
    if(!ids.length) P.appendChild(el("div","empty","No stock yet.<br>Buy some books first."));

      r.appendChild(auto);
      if(!st.auto){
        const m=el("button","btn-sm","−"); m.onclick=e=>{e.stopPropagation();st.price=Math.max(st.cost,st.price-2);drawMorning();};
        const p2=el("button","btn-sm","+"); p2.onclick=e=>{e.stopPropagation();st.price+=2;drawMorning();};
        r.appendChild(m); r.appendChild(p2);
      }

      r.appendChild(lab);

      c.querySelector(".meta").appendChild(ctl);
      P.appendChild(c);
    });
  }

  if(S.tab==="shop"){
    const tierInfo=SIZE_TIERS[S.tier];
    P.appendChild(el("p",null,tierInfo.name+" · level "+level()+" · rent "+rm(rent())+"/day · "+maxCustomers()+" customers expected."));
    const nt=nextTier();
    if(nt){
      const locked = S.rep<nt.rep;
      const c=el("div","card"+(locked?" lock":""));
      const m=el("div","meta");
      m.appendChild(el("div","t","Upgrade to "+nt.name+" · "+rm(nt.cost)));
      m.appendChild(el("div","a","Bigger floor, more shelf room, more foot traffic — and rent rises to "+rm(nt.rent)+"/day."+
        (locked?" Needs reputation "+nt.rep+".":"")));
      const btn=el("button","btn-sm",locked?"LOCKED":"UPGRADE SPACE");
      btn.disabled=locked||S.cash<nt.cost;
      btn.onclick=()=>upgradeSpace();
      const bw=el("div"); bw.style.marginTop="5px"; bw.appendChild(btn);
      m.appendChild(bw); c.appendChild(m); P.appendChild(c);
    } else {
      P.appendChild(el("p",null,"This is the biggest space on the row. Nowhere further to expand."));

  }

  setAction("OPEN THE SHOP",()=>{
    if(!shelvedIds().length){tip("You have nothing on the shelves.");return;}
    startDay();
  });
  tip(shopLabel()+" · day "+S.day+", morning. Stock, price, then open.");
}
function buyStock(id){
  const bk=BOOK(id), spend=bk.cost*2;
  if(S.cash<spend) return;
  S.cash-=spend; S.stats.spent+=spend;
  S.stock[id]={copies:2,cost:bk.cost,price:autoPrice(bk.cost),auto:true};
  // shelve it
  const shelves=tilesOf(SHELF);
  for(const [x,y] of shelves){ const k=key(x,y); S.slots[k]=S.slots[k]||[];
    if(S.slots[k].length<3){ S.slots[k].push(id); break; } }
  S.offers=S.offers.filter(o=>o!==id);
  drawMorning(); hud();
}

/* ---------- open ---------- */
const SHOP_OPEN_MIN=10*60, SHOP_CLOSE_MIN=19*60;       // 10:00am - 7:00pm, ticks down over the 60s trading window
function shopClock(){
  const frac=clamp(S.tick/S.dayLen,0,1);
  const totalMin=Math.floor(SHOP_OPEN_MIN + (SHOP_CLOSE_MIN-SHOP_OPEN_MIN)*frac);
  const h24=Math.floor(totalMin/60), m=totalMin%60;
  const ampm=h24<12?"AM":"PM", h12=((h24+11)%12)+1;
  return h12+":"+String(m).padStart(2,"0")+" "+ampm;
}

function renderTalk(p,convo){
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");

function renderPick(p,convo){
  const sh=$("#sheet"); sh.innerHTML="";
  sh.appendChild(el("div","speaker","RECOMMEND TO "+p.name.toUpperCase()));
  if(p.clues.length){ const cl=el("div","clues"); p.clues.forEach(c=>cl.appendChild(el("span","tag g",c))); sh.appendChild(cl); }
  const ids=shelvedIds().filter(id=>S.stock[id]&&S.stock[id].copies>0);
  const grid=el("div","pick");
  ids.forEach(id=>{
    const bk=BOOK(id);

    cell.appendChild(coverCanvas(bk,100,150));
    cell.appendChild(el("div",null,bk.title.slice(0,22)+"<br><span style='color:var(--gold)'>"+rm(priceOf(id))+"</span>"));
    cell.onclick=()=>renderConfirm(p,id,convo);
    grid.appendChild(cell);
  });
  sh.appendChild(grid);
  const back=el("button","choice","← Keep talking"); back.onclick=()=>renderTalk(p,convo);
  sh.appendChild(back);
}
function renderConfirm(p,id,convo){
  const bk=BOOK(id), sh=$("#sheet"); sh.innerHTML="";
  sh.appendChild(el("div","speaker","BEFORE YOU RECOMMEND"));
  const head=el("div","bookhead");
  head.appendChild(coverCanvas(bk,80,120));
  const hm=el("div");
  hm.appendChild(el("div","t",bk.title));
  hm.appendChild(el("div","a",bk.author+" · "+bk.year));
  hm.appendChild(el("div","price",rm(priceOf(id))));
  const tr=el("div","tagrow");
  tr.appendChild(el("span","tag b",GENRE_LABEL[bk.genre]||bk.genre));
  bk.moods.forEach(m=>tr.appendChild(el("span","tag",m)));
  tr.appendChild(el("span","tag",bk.pace));
  hm.appendChild(tr);
  head.appendChild(hm);
  sh.appendChild(head);
  sh.appendChild(el("p",null,bk.blurb));
  const th=el("div","tagrow"); bk.themes.forEach(t=>th.appendChild(el("span","tag r",t))); sh.appendChild(th);
  sh.appendChild(el("h3",null,"Reader rating"));
  sh.appendChild(ratingBlock(bk));
  if(p.clues.length){
    sh.appendChild(el("h3",null,"What "+p.name+" told you"));
    const cl=el("div","clues"); p.clues.forEach(c=>cl.appendChild(el("span","tag g",c))); sh.appendChild(cl);
  }
  const yes=el("button","choice"); yes.style.borderColor="var(--gold)"; yes.style.color="var(--gold)";
  yes.textContent="Recommend this to "+p.name;
  yes.onclick=()=>resolve(p,id,convo);
  sh.appendChild(yes);
  const back=el("button","choice","← Choose another book");
  back.onclick=()=>renderPick(p,convo);
  sh.appendChild(back);
  sh.scrollTop=0;
}
function resolve(p,id,convo){
  const sc=scoreMatch(p,id), bk=BOOK(id);
  const sh=$("#sheet"); sh.innerHTML="";
  sh.appendChild(el("div","speaker",p.name.toUpperCase()));
  sh.appendChild(el("div","say me","> \""+bk.title+"\" — I think this is you."));
  const bought=sc>=55;
  sh.appendChild(el("div","say", bought? p.arch.yes : p.arch.no));
  const v=el("div","verdict "+(bought?"good":"bad"));
  v.textContent = sc>=85? "PERFECT MATCH · "+sc : bought? "SOLD · "+sc : "NO SALE · "+sc;
  sh.appendChild(v);
  if(!bought){
    const w=p.arch.want;
    sh.appendChild(el("p",null,"They wanted: "+w.genres.map(g=>GENRE_LABEL[g]).join(", ")+
      " · "+w.moods.join(", ")+" · under "+rm(w.max)+
      (w.avoid.length?" · never "+w.avoid.join(", "):"")));
  }
  if(bought) completeSale(p,id,false);
  else { p.patience=Math.min(p.patience,60); p.state="browse"; S.rep=clamp(S.rep-0.3,0,100); }
  const ok=el("button","choice","Continue");
  ok.onclick=()=>{ closeModal(); S.talking=null; if(p.state==="talking")p.state="browse"; drawOpenPanel(); };
  sh.appendChild(ok);
  hud();
}
function closeModal(){ $("#modal").classList.remove("on"); }

/* ---------- book card ---------- */
function openBook(id){
  const bk=BOOK(id);
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  const head=el("div","bookhead");
  head.appendChild(coverCanvas(bk,76,114));
  const hm=el("div");
  hm.appendChild(el("div","t",bk.title));
  hm.appendChild(el("div","a",bk.author));
  hm.appendChild(el("div","a","First published "+bk.year));
  const tr=el("div","tagrow");
  tr.appendChild(el("span","tag b",GENRE_LABEL[bk.genre]||bk.genre));
  bk.moods.forEach(m=>tr.appendChild(el("span","tag",m)));
  tr.appendChild(el("span","tag",bk.pace));
  hm.appendChild(tr);
  head.appendChild(hm);
  sh.appendChild(head);
  sh.appendChild(el("p",null,bk.blurb));
  const th=el("div","tagrow"); bk.themes.forEach(t=>th.appendChild(el("span","tag r",t))); sh.appendChild(th);
  sh.appendChild(el("h3",null,"Reader rating"));
  sh.appendChild(ratingBlock(bk));
  const buy=el("button","buy","ORDER A PHYSICAL COPY · "+rm(autoPrice(bk.cost)));
  buy.onclick=()=>orderPanel(bk);
  sh.appendChild(buy);
  sh.appendChild(el("div","note","Prototype: catalogue is a frozen snapshot of real bibliographic records. In the shipped app this screen is a live Open Library / Google Books lookup, and the button above hits the real storefront. The rating above is a real reader aggregate (not an invented character quote) — approximate and offline here, pulled live from a ratings API in the shipped build."));
  const cl=el("button","choice","Close"); cl.style.marginTop="8px"; cl.onclick=closeModal; sh.appendChild(cl);
}
function orderPanel(bk){
  const sh=$("#sheet"); sh.innerHTML="";
  sh.appendChild(el("div","speaker","ORDER · PHYSICAL COPY"));
  sh.appendChild(el("div","say",bk.title+"\nby "+bk.author));
  sh.appendChild(el("div","ledger","<span>Book</span><b>"+rm(autoPrice(bk.cost))+"</b>"));
  sh.appendChild(el("div","ledger","<span>Courier · Klang Valley</span><b>RM8.00</b>"));
  sh.appendChild(el("div","ledger pos","<span>Total</span><b>"+rm(autoPrice(bk.cost)+8)+"</b>"));
  sh.appendChild(el("p",null,"Delivered in 2 working days. This is the commerce hook — in the live build it opens checkout. Nothing is charged here."));
  const cl=el("button","choice","← Back"); cl.onclick=()=>openBook(bk.id); sh.appendChild(cl);
}

/* ---------- evening ---------- */
function drawEvening(){
  const P=$("#panel"); P.innerHTML="";
  P.appendChild(el("h2",null,"DAY "+S.day+" · CLOSED"));
  const st=S.stats, r=rent();
  const rows=[["Takings",st.rev,"pos"],["Stock bought",-st.spent,"neg"],["Rent",-r,"neg"],
    ["Net", st.rev-st.spent-r, (st.rev-st.spent-r)>=0?"pos":"neg"]];
  rows.forEach(([l,v,c])=>P.appendChild(el("div","ledger "+c,"<span>"+l+"</span><b>"+(v<0?"-":"")+rm(Math.abs(v))+"</b>")));
  P.appendChild(el("h3",null,"The day"));
  P.appendChild(el("p",null, st.served+" served · "+st.delighted+" delighted · "+st.walkouts+" walked out unserved."+
    (st.walkouts>2?" You are losing people to impatience. A Kopi Corner or more palms would buy you time.":"")));
  P.appendChild(el("p",null,"Reputation "+Math.round(S.rep)+"/100 · level "+level()+
    (level()<3?" · next unlock at "+(level()===1?18:45):" · everything unlocked")));
  if(S.cash<0) P.appendChild(el("p",null,"You are in the red. Uncle Lim is carrying you on credit — you won't close, but you cannot restock until you're positive."));
  P.appendChild(el("h3",null,"Sales"));
  if(!S.history.length) P.appendChild(el("div","empty","Nobody bought anything today."));
  S.history.slice(0,8).forEach(h=>P.appendChild(el("div","cost","· "+h)));
  setAction("NEXT MORNING",()=>{ S.history=[]; nextDay(); });
  tip("Shutters down. Tap NEXT MORNING below to start day "+(S.day+1)+".");
}

function paint(){
  hud();
  if(S.phase==="morning") drawMorning();
  else if(S.phase==="open") drawOpenPanel();
  else drawEvening();
}

/* ---------- input ---------- */
cv.addEventListener("click",e=>{
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*GW);
  const y=Math.floor((e.clientY-r.top)/r.height*GH);
  if(S.placing!=null && S.phase==="morning"){
    if(S.grid[y]&&S.grid[y][x]===EMPTY){
      const f=FURN[S.placing];
      if(S.cash>=f.cost){ S.cash-=f.cost; S.stats.spent+=f.cost; S.grid[y][x]=S.placing;
        if(f.slots) S.slots[key(x,y)]=[]; }
    }
    S.placing=null; tip("Placed."); paint(); return;
  }
  if(S.phase==="open"){
    let hit=null,bd=99;
    S.customers.forEach(p=>{ if(p.served||p.state==="leave")return;
      const d=Math.hypot(p.px-(x*TS+8), p.py-(y*TS+6)); if(d<bd&&d<18){bd=d;hit=p;} });
    if(hit){ talk(hit); return; }
  }
  const t=S.grid[y]&&S.grid[y][x];
  if(t===SHELF||t===TABLE){
    const ids=S.slots[key(x,y)]||[];
    if(ids.length){ const sh=$("#sheet"); sh.innerHTML=""; $("#modal").classList.add("on");
      sh.appendChild(el("div","speaker","THIS SHELF"));
      ids.forEach(id=>sh.appendChild(bookCard(BOOK(id),
        "<div class='price' style='margin-top:4px'>"+rm(priceOf(id))+" · "+(S.stock[id]?S.stock[id].copies:0)+" left</div>",
        ()=>openBook(id))));
      const cl=el("button","choice","Close"); cl.onclick=closeModal; sh.appendChild(cl);
    }
  }
});
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") { if(!S.talking) closeModal(); } });

/* ---------- boot ---------- */
initGrid(); rollOffers(); paint();
requestAnimationFrame(loop);
function nameScreen(){
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  const portrait=document.createElement("img"); portrait.className="keeper-portrait";
  portrait.src=KEEPER_PORTRAIT; portrait.alt="You, behind the counter";
  sh.appendChild(portrait);
  sh.appendChild(el("div","speaker","NAME YOUR SHOP"));
  sh.appendChild(el("p",null,"Every shoplot on the row has a name painted above the door. Yours goes on the sign."));
  const row=el("div","namerow");
  row.appendChild(el("span",null,"KEDAI BUKU"));
  const inp=document.createElement("input");
  inp.id="shopName"; inp.type="text"; inp.maxLength=16; inp.placeholder="your name";
  inp.autocomplete="off"; inp.value=S.shopName;
  row.appendChild(inp);
  sh.appendChild(row);
  sh.appendChild(el("p",null,"Leave it blank and the sign just reads KEDAI BUKU."));
  const go=el("button","choice"); go.style.borderColor="var(--gold)"; go.style.color="var(--gold)";
  go.textContent="Paint the sign →";
  go.onclick=()=>{ S.shopName=inp.value.trim().slice(0,16); introScreen(); };
  sh.appendChild(go);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go.click(); });
  setTimeout(()=>inp.focus(),50);
}
function introScreen(){
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  sh.appendChild(el("div","speaker",shopLabel().toUpperCase()));
  sh.appendChild(el("div","say","A corner kiosk in Petaling Jaya. Yours since this morning. Two shelves, a counter, and RM1,500 — rent is only RM30 a day here, but the space is small. Grow reputation and cash and you can upgrade to a bigger lot."));
  sh.appendChild(el("p",null,"Two things decide whether you survive: what you choose to stock, and whether you can read the person standing in front of you."));
  sh.appendChild(el("p",null,"MORNING — buy stock, set prices, fit out the shop.<br>OPEN — customers come in. Tap one, ask up to three questions, then recommend from your shelves.<br>CLOSED — pay the rent."));
  sh.appendChild(el("p",null,"Every book is real. Tap any cover to read it up properly."));
  const go=el("button","choice","Open up →"); go.style.borderColor="var(--gold)"; go.style.color="var(--gold)";
  go.onclick=()=>{ closeModal(); paint(); }; sh.appendChild(go);
}
setTimeout(nameScreen,200);
</script>
