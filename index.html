/* ---------- input ---------- */
cv.addEventListener("click",e=>{
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*GW);
  const y=Math.floor((e.clientY-r.top)/r.height*GH);
  if(S.placing!=null && S.phase==="morning"){
    if(S.grid[y]&&S.grid[y][x]===EMPTY&&!isKeeperTile(x,y)){
      const f=FURN[S.placing];
      if(S.cash>=f.cost){ S.cash-=f.cost; S.stats.spent+=f.cost; S.grid[y][x]=S.placing;
        if(f.slots) S.slots[key(x,y)]=[];
        if(S.placing===SHELF||S.placing===TABLE) restockShelves(); }
    }
    S.placing=null; tip("Placed."); paint(); autosave(); return;
  }
  if(CATW.state!=="home" && Math.hypot(CATW.px-(x*TS+8), CATW.py-4-(y*TS+8))<11){
    tip(rnd(CATW.state==="walk"?CAT_WALK_LINES:CAT_LINES)); return; }
  if(S.grid[y]&&S.grid[y][x]===CAT){ tip(rnd(CATW.state==="home"?CAT_LINES:CUSHION_LINES)); return; }
  if(S.phase==="open" && leoWalletAt(x,y)){ leoFindWallet(); return; }
  if(S.phase==="open"){
    let hit=null,bd=99;
    S.customers.forEach(p=>{ if(p.served||p.state==="leave")return;
      const d=Math.hypot(p.px-(x*TS+8), p.py-(y*TS+6)); if(d<bd&&d<18){bd=d;hit=p;} });
    if(hit){ talk(hit); return; }
  }
  const t=S.grid[y]&&S.grid[y][x];
  if(t===INFO||t===INFO_R){ infoDesk(); return; }
  if(t===RACK){ magazineRack(); return; }
  if(t===VINYL||t===VINYL_R){ recordCorner(); return; }
  if(t===SHELF||t===TABLE){
    const ids=S.slots[key(x,y)]||[];
    if(ids.length){ const sh=$("#sheet"); sh.innerHTML=""; $("#modal").classList.add("on");
      sh.appendChild(el("h3",null,t===TABLE?"On display":"This shelf")).style.marginTop="0";
      ids.forEach(id=>sh.appendChild(bookCard(BOOK(id),
        "<div class='price' style='margin-top:4px'>"+rm(priceOf(id))+" · "+(S.stock[id]?S.stock[id].copies:0)+" left</div>",
        ()=>openBook(id))));
      sh.appendChild(ghost("Close",closeModal));
    }
  }
});
$("#modal").addEventListener("click",e=>{
  if(e.target.id!=="modal" || S.talking || lockModal) return;
  dismissSheet();
});
// The X in the corner of every pop-up: close it all the way, from whatever page of it you're on.
function dismissSheet(){
  if(lockModal) return;
  if(georgeTalking()){ georgeNext(); return; }
  if(leoTalking()){ if(LEOS.state!=="ask") leoNext(); return; }   // his question needs an answer
  if(S.talking){ endTalk(); return; }
  if(STK.open){ closeStockTake(); return; }
  closeModal();
  if(paused && !titleOn()) paused=false;   // closing the menu is the same as Resume
}
$("#sheetX").onclick=dismissSheet;
function setLock(on){ lockModal=on; $("#modal").classList.toggle("locked",on); }
// A button that silently does nothing is undiagnosable from a report. If a script error
// escapes, say so in the tip line, in words a player can pass back.
function reportError(msg){ tip("Something went wrong: "+(msg||"unknown error")+". Please report this line."); }
window.addEventListener("error",e=>reportError(e.message));
window.addEventListener("unhandledrejection",e=>reportError(e.reason&&e.reason.message||String(e.reason)));

/* ============================================================
   MUSIC
   A four-track playlist played in order, wrapping back to the first after the
   last, so the music never stops while the game is open. Browsers refuse to start audio
   before the player has touched the page, so it starts on the first tap or key
   rather than on load. The on/off choice is a per-browser preference, kept out
   of the save on purpose — it belongs to the device, not the shop.
   ============================================================ */
const MUSIC_KEY="cornerbooks.music";
const bgm=$("#bgm"), musicBtn=$("#music");
const MUSIC_ICON={on:ICON.music, off:ICON.mute};
let musicOn=true;
let musicHold=false;          // a story moment has stopped the music for a while, without changing the setting
try{ musicOn=localStorage.getItem(MUSIC_KEY)!=="off"; }catch(e){}
bgm.volume=0.35;
const PLAYLIST=[
  "audio/paperback-afternoon.mp3",
  "audio/a-chapter-for-later.mp3",
  "audio/a-quiet-corner.mp3",
  "audio/sunlight-on-the-shelf.mp3"
];
// the same four tracks are the records in grandfather's record corner, one sleeve colour each
const RECORDS=[
  {title:"Paperback Afternoon",    color:"#f26b3a"},
  {title:"A Chapter for Later",    color:"#3aa8e8"},
  {title:"A Quiet Corner",         color:"#3fbf68"},
  {title:"Sunlight on the Shelf",  color:"#ffc527"},
];
const RECORD_SPINES=["#f26b3a","#3aa8e8","#3fbf68","#ffc527","#f3efe6","#3d4466","#f27a9a","#8a7ae0","#22b3a3"];
let track=0;
// a track only ends while it is playing, so the next one may start straight away
bgm.addEventListener("ended",()=>{
  track=(track+1)%PLAYLIST.length;
  bgm.src=PLAYLIST[track];
  playMusic();
});
function playMusic(){ if(musicOn && !musicHold && !document.hidden) bgm.play().catch(()=>{}); }
function musicPlaying(){ return !bgm.paused && !bgm.ended; }
function setMusic(on){
  musicOn=on;
  if(on) musicHold=false;               // the player asked for music: that beats any story pause
  try{ localStorage.setItem(MUSIC_KEY,musicOn?"on":"off"); }catch(e){}
  paintMusic();
  if(musicOn) playMusic(); else bgm.pause();
}
function paintMusic(){
  musicBtn.innerHTML=musicOn?MUSIC_ICON.on:MUSIC_ICON.off;
  musicBtn.classList.toggle("off",!musicOn);
  musicBtn.setAttribute("aria-pressed",String(musicOn));
  musicBtn.setAttribute("aria-label",musicOn?"Music on":"Music off");
}
musicBtn.addEventListener("click",()=>setMusic(!musicOn));
// the first touch anywhere is what the browser counts as permission to play
function firstGesture(){
  document.removeEventListener("pointerdown",firstGesture,true);
  document.removeEventListener("keydown",firstGesture,true);
  playMusic();
}
document.addEventListener("pointerdown",firstGesture,true);
document.addEventListener("keydown",firstGesture,true);
// don't play to an empty room when the phone is locked or the tab is in the background
document.addEventListener("visibilitychange",()=>{ if(document.hidden) bgm.pause(); else if(bgm.played.length) playMusic(); });
paintMusic();

/* ---------- record corner ----------
   Grandfather's turntable. Choosing a record drops the needle on that track and the playlist
   carries on from there; lifting the needle is the same as turning the music off. */
function recordCorner(){
  if(S.talking || titleOn()) return;
  paused=true;
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  sh.appendChild(el("h2",null,"Record corner")).style.marginBottom="6px";
  sh.appendChild(el("p",null,"Grandfather's turntable, and the records he played while the shop was open. Pick one to drop the needle — the rest play on after it, in order."));
  const playing=musicPlaying();
  sh.appendChild(el("div","count",playing?"Now playing: "+RECORDS[track].title:"The needle is up."));
  const L=el("div","records");
  RECORDS.forEach((r,i)=>{
    const on=playing && i===track;
    const b2=el("button","choice record"+(on?" playing":""));
    b2.appendChild(el("span","sleeve")).style.background=r.color;
    const m=el("span","meta"); m.appendChild(el("span","t",r.title)); m.appendChild(el("span","a",on?"Playing ♪":"Side A · "+(i+1)+" of "+RECORDS.length));
    b2.appendChild(m);
    b2.onclick=()=>{ if(on) return; track=i; bgm.src=PLAYLIST[i]; setMusic(true); };
    L.appendChild(b2);
  });
  sh.appendChild(L);
  const up=primary(playing?"Lift the needle":"Needle's up",()=>setMusic(false));
  up.disabled=!playing;
  sh.appendChild(up);
  sh.appendChild(ghost("Back to the shop",dismissSheet));
}
// keep the record corner honest when a record starts, stops or the next one comes on
["play","pause"].forEach(ev=>bgm.addEventListener(ev,()=>{ if($("#modal").classList.contains("on") && $("#sheet .records")) recordCorner(); }));

/* ---------- George: a one-off visit on day 1 ----------
   Around noon on the first trading day the music stops and an old man comes in: George, one of
   grandfather's regulars. He walks up to the counter and says his piece (the clock stops while
   he talks), the music comes back, and then he goes over to the cat, gives it a pat and calls it
   by its name. Then he leaves. The shop clock holds at noon from the moment he walks in until he
   is out of the door; customers keep browsing, and nobody new comes in meanwhile. Seen once per shop: S.events.george is saved at the evening, so
   quitting mid-way through day 1 replays the day and the visit with it. */
const GEORGE_TICK=200;                 // 12:00 on the shop clock (10am + 2/9 of the 900-tick day)
const GEORGE={key:"george",name:"George",role:"One of grandfather's regulars",
  skin:"#eabf98",hair:"#e3e4ea",shirt:"#8c6a4f",style:"crop",pants:"#5b4636"};
// state: null → "in" (walking to the counter) → "talk1" → "waitcat" → "tocat" → "pat" → "talk2" → "out" → "done"
const GEO={state:null,p:null,t:0,cat:null,f:0};
function georgeReset(){
  if(musicHold){ musicHold=false; playMusic(); }
  GEO.state=null; GEO.p=null; GEO.t=0; GEO.cat=null;
}
function georgeTalking(){ return GEO.state==="talk1"||GEO.state==="talk2"; }
function georgeHold(){ return georgeTalking(); }                       // the trading clock stops while he talks
function georgeHoldsCat(){ return GEO.state==="tocat"||GEO.state==="pat"||GEO.state==="talk2"; }
function modalOn(){ return $("#modal").classList.contains("on"); }
function georgeWalk(p){
  if(p.path && p.pi<p.path.length){
    const [tx,ty]=p.path[p.pi], dx=(tx*TS+8)-p.px, dy=(ty*TS+2)-p.py, sp=1.0;   // an unhurried walk
    p.moving=true; p.t++;
    if(Math.abs(dx)>Math.abs(dy)) p.dir=dx>0?"right":"left"; else if(Math.abs(dy)>0.5) p.dir=dy>0?"down":"up";
    if(Math.abs(dx)<=sp&&Math.abs(dy)<=sp){ p.px=tx*TS+8; p.py=ty*TS+2; p.gx=tx; p.gy=ty; p.pi++; }
    else { p.px+=clamp(dx,-sp,sp); p.py+=clamp(dy,-sp,sp); }
    return false;
  }
  p.moving=false; return true;
}
// the first open, reachable floor tile from a list of candidates
function georgeRoute(p,spots){
  for(const [x,y] of spots){
    if(!S.grid[y] || S.grid[y][x]!==EMPTY || isKeeperTile(x,y)) continue;
    const path=pathTo(p,x,y); if(path) return path;
  }
  return null;
}
function georgeEnter(){
  const dx=doorX();
  const p={gx:dx, gy:GH-1, px:dx*TS+8, py:(GH-1)*TS+2, dir:"up", moving:true, path:null, pi:0, t:0};
  const c=tilesOf(COUNTER)[0]||[dx,2];
  p.path=georgeRoute(p,[[c[0],c[1]+1],[c[0]-1,c[1]+1],[c[0]+1,c[1]+1],[dx,GH-2]])||[];
  p.pi=0;
  GEO.p=p; GEO.state="in";
  musicHold=true; bgm.pause();
  tip("The music stops. An old man in a cardigan comes in through the door.");
}
function georgeSpeaker(){
  const d=el("div","speaker");
  d.appendChild(avatarImg(GEORGE));
  d.appendChild(el("div",null,GEORGE.name+"<small>"+GEORGE.role+"</small>"));
  return d;
}
function georgeSheet(lines,label,note){
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  sh.appendChild(georgeSpeaker());
  lines.forEach(t=>sh.appendChild(el("div","say",t)));
  if(note) sh.appendChild(el("div","verdict good",note));
  sh.appendChild(primary(label,georgeNext));
}
const GEORGE_REP=5;                    // his blessing: word gets round that the shop is open again
function georgeTalk(){
  if(GEO.state==="talk1") georgeSheet([
    "Well, well. The shutters are up! You must be the grandchild. I'm George.",
    "I was a regular here for years, back when your grandfather was still alive. Every Saturday, without fail. He always had something put aside for me.",
    "I can't tell you how happy I am to see this place open again. I walked past it every day while it was closed.",
    "You work hard, now, and keep the shop running. He'd have liked that very much.",
  ],"Thank you, George. I will.","+"+GEORGE_REP+" Reputation");
  else if(GEO.state==="talk2") georgeSheet(["Hey, Mimi! Long time no see!"],"Continue");
}
// closing either of his pop-ups moves the visit on
function georgeNext(){
  if(GEO.state==="talk1"){
    closeModal(); GEO.state="waitcat";
    S.rep=clamp(S.rep+GEORGE_REP,0,100); hud();
    musicHold=false; playMusic();
    tip("George looks round the shop, then spots the cushion in the corner.");
  } else if(GEO.state==="talk2"){
    closeModal(); GEO.state="out";
    S.events.george=true;
    const p=GEO.p; p.path=pathTo(p,doorX(),GH-1)||[]; p.pi=0;
    tip("So grandfather's cat is called Mimi. George waves on his way out.");
  }
}
function georgeStep(){
  if(GEO.state==="done") return;
  if(GEO.state===null){
    if(S.day!==1 || S.events.george || S.tick<GEORGE_TICK || S.tick>=S.dayLen-60 || modalOn()) return;
    georgeEnter(); return;
  }
  const p=GEO.p;
  if(georgeTalking()){ if(!modalOn()) georgeTalk(); return; }   // something else replaced his pop-up: bring it back
  if(modalOn()) return;                                          // another pop-up is up: he waits
  if(GEO.state==="in"){
    if(georgeWalk(p)){ p.dir="up"; GEO.state="talk1"; georgeTalk(); }
  } else if(GEO.state==="waitcat"){
    if(CATW.state==="walk") return;                              // let the cat finish its stroll first
    const cat=CATW.state==="home"?catHome():[CATW.x,CATW.y];
    if(!cat){ GEO.state="talk2"; georgeTalk(); return; }
    GEO.cat=cat;
    const [cx,cy]=cat;
    const path=georgeRoute(p,[[cx-1,cy],[cx,cy-1],[cx+1,cy],[cx,cy+1],[cx-1,cy-1],[cx+1,cy-1]]);
    if(path){ p.path=path; p.pi=0; GEO.state="tocat"; }
    else { GEO.state="pat"; GEO.t=0; }                           // nowhere to stand: he says hello from here
  } else if(GEO.state==="tocat"){
    if(georgeWalk(p)){
      const [cx,cy]=GEO.cat;
      p.dir=cx>p.gx?"right":cx<p.gx?"left":cy<p.gy?"up":"down";
      GEO.state="pat"; GEO.t=0;
      tip("George crouches down by the cat and gives it a pat.");
    }
  } else if(GEO.state==="pat"){
    if(++GEO.t>=26){ GEO.state="talk2"; georgeTalk(); }
  } else if(GEO.state==="out"){
    if(georgeWalk(p)){ GEO.state="done"; GEO.p=null; }
  }
}
function georgeActor(){
  const p=GEO.p; if(!p) return null;
  const step=p.moving?Math.sin(p.t*0.8):0;
  const bob=GEO.state==="pat"?!!((GEO.t>>2)&1):p.moving&&Math.abs(step)>0.5;
  return {y:p.py+13, draw:()=>drawFigure(ctx,Math.round(p.px),Math.round(p.py),Object.assign({},GEORGE,{dir:p.dir,step,bob}))};
}
// a little pixel heart rising over the cat while George pats it
const PAT_HEART=[".OO.OO.","OffOffO","OfffffO",".OfffO.","..OfO..","...O..."];
function drawPatHeart(){
  if(!(GEO.state==="pat"||GEO.state==="talk2") || !GEO.cat) return;
  const t=GEO.state==="pat"?GEO.t:26, [cx,cy]=GEO.cat;
  const X=cx*TS+5, Y=cy*TS-1-Math.round(Math.min(t,26)/6);
  PAT_HEART.forEach((row,y)=>{ for(let x=0;x<7;x++){ const k=row[x]; if(k===".") continue;
    R(ctx,X+x,Y+y,1,1,k==="O"?INK:"#e8566a"); } });
}

/* ---------- Leo and the wallet: a one-off story on day 2 ----------
   Just after opening on the second trading day a young man comes in: Leo, who works round the
   corner. He has a quick look at the counter without a word and goes. Once he is out of the door there is a wallet on
   the floor where he stood; tap it to pick it up. Two hours (on the shop clock) after the keeper
   picks it up, Leo comes back and asks whether anyone found a wallet. Give it back: +10
   reputation and his thanks. Say no: keep the $200 inside, and lose 10 reputation as word gets
   round. The clock holds while any of his pop-ups is up. If the wallet is still on the floor at
   closing time the shop waits for the keeper to find it, and Leo comes back straight away.
   Seen once per shop (S.events.leo), saved with the evening like George's visit. */
const LEO_TICK=10;                     // a few minutes after 10am on day 2
const LEO_BACK=200;                    // two hours on the shop clock (900 ticks = 9 hours)
const LEO_REP=10, LEO_CASH=200;
const LEO={key:"leo",name:"Leo",role:"Works round the corner",
  skin:"#d8a27a",hair:"#3a2618",shirt:"#3f7fb0",style:"crop",pants:"#3b3f52"};
// state: null → "in" → "look" (a silent glance round) → "out" → "gone" (wallet on the floor) → "found" (its pop-up)
//        → "held" → "back" → "ask" → "returned" | "kept" → "leave" → "done"
const LEOS={state:null,p:null,wallet:null,foundAt:0,backAt:0,t:0};
function leoReset(){ LEOS.state=null; LEOS.p=null; LEOS.wallet=null; LEOS.foundAt=0; LEOS.backAt=0; LEOS.t=0; }
function leoTalking(){ return ["found","ask","returned","kept"].includes(LEOS.state); }
// the day can't close while the wallet story is half-told
function leoPending(){ return !!LEOS.p || ["gone","found","held"].includes(LEOS.state); }
function leoSheet(who,lines,buttons,note,bad){
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  if(who){
    const d=el("div","speaker");
    d.appendChild(avatarImg(LEO));
    d.appendChild(el("div",null,LEO.name+"<small>"+LEO.role+"</small>"));
    sh.appendChild(d);
  } else sh.appendChild(el("h2",null,"Something on the floor")).style.marginBottom="10px";
  lines.forEach(t=>sh.appendChild(el("div","say",t)));
  if(note) sh.appendChild(el("div","verdict "+(bad?"bad":"good"),note));
  buttons.forEach(([label,fn,plain])=>sh.appendChild((plain?ghost:primary)(label,fn)));
}
function leoTalk(){
  const s=LEOS.state;
  if(s==="found") leoSheet(false,[
    "Someone left a wallet on the floor by the counter.",
    "You pick it up and put it away safely behind the counter.",
  ],[["Keep the wallet",leoNext]]);
  else if(s==="ask") leoSheet(true,[
    "Hi, sorry — I was in here first thing this morning. I'm Leo. I can't find my wallet anywhere.",
    "I think I might have dropped it in here. You didn't find a wallet, did you?",
  ],[["Yes — here it is.",()=>leoChoose(true)],["No, sorry. I haven't seen one.",()=>leoChoose(false)]]);
  else if(s==="returned") leoSheet(true,[
    "Oh, thank goodness! Everything's still in it.",
    "Thank you — really. Most people wouldn't have bothered. I'll be telling everyone at work about this shop.",
  ],[["Glad it turned up.",leoNext]],"+"+LEO_REP+" Reputation");
  else if(s==="kept") leoSheet(true,[
    "Oh… right. Must have been on the bus, then.",
    "Thanks anyway.",
  ],[["Continue",leoNext]],"+$"+LEO_CASH+" · −"+LEO_REP+" Reputation",true);
}
function leoChoose(give){
  if(give){ S.rep=clamp(S.rep+LEO_REP,0,100); LEOS.state="returned"; log("Gave Leo his wallet back (+"+LEO_REP+" rep)"); }
  else { S.rep=clamp(S.rep-LEO_REP,0,100); S.cash=Math.round((S.cash+LEO_CASH)*100)/100;
    LEOS.state="kept"; log("Kept Leo's wallet: +$"+LEO_CASH+", −"+LEO_REP+" rep"); }
  S.events.leo=true; hud(); leoTalk();
}
function leoNext(){
  const s=LEOS.state, p=LEOS.p;
  if(s==="found"){
    closeModal(); LEOS.state="held"; LEOS.wallet=null; LEOS.foundAt=S.tick;
    LEOS.backAt=Math.min(S.tick+LEO_BACK, S.dayLen-30);
    if(LEOS.backAt<=S.tick) LEOS.backAt=S.tick+15;                // found at closing: he's back at once
    tip("You put the wallet away behind the counter.");
  } else if(s==="returned"||s==="kept"){
    closeModal();
    tip(s==="returned"?"Leo tucks his wallet away and waves on his way out."
                      :"Leo leaves empty-handed. There's $"+LEO_CASH+" in the wallet.");
    LEOS.state="leave"; p.path=pathTo(p,doorX(),GH-1)||[]; p.pi=0;
  }
  drawOpenPanel();
}
function leoAtCounter(){
  const dx=doorX();
  const p={gx:dx, gy:GH-1, px:dx*TS+8, py:(GH-1)*TS+2, dir:"up", moving:true, path:null, pi:0, t:0};
  const c=tilesOf(COUNTER)[0]||[dx,2];
  p.path=georgeRoute(p,[[c[0],c[1]+1],[c[0]-1,c[1]+1],[c[0]+1,c[1]+1],[c[0],c[1]+2],[dx,GH-2]])||[];
  p.pi=0;
  return p;
}
function leoStep(){
  const s=LEOS.state;
  if(s==="done") return;
  if(s===null){
    if(S.day!==2 || S.events.leo || S.tick<LEO_TICK || S.tick>=S.dayLen-60 || modalOn()) return;
    LEOS.p=leoAtCounter(); LEOS.state="in";
    tip("A young man in a blue shirt comes in, looking at his watch.");
    return;
  }
  if(leoTalking()){ if(!modalOn()) leoTalk(); return; }
  if(modalOn()) return;
  const p=LEOS.p;
  if(s==="in"){ if(georgeWalk(p)){ p.dir="up"; LEOS.state="look"; LEOS.t=0; } }
  else if(s==="look"){                                           // a quick glance at the counter, then off
    if(++LEOS.t===24) p.dir="left"; else if(LEOS.t===36) p.dir="right";
    else if(LEOS.t>=50){
      LEOS.state="out"; LEOS.wallet=[p.gx,p.gy];                 // it slips out of his pocket here
      p.path=pathTo(p,doorX(),GH-1)||[]; p.pi=0;
      tip("He checks his watch again and hurries back out of the door.");
    }
  }
  else if(s==="out"){
    if(georgeWalk(p)){ LEOS.p=null; LEOS.state="gone";
      tip("He's gone. Is that something on the floor by the counter?"); }
  } else if(s==="gone"){
    if(S.tick>=S.dayLen) tip("Before you lock up — there's something on the floor by the counter.");
  } else if(s==="held"){
    if(S.tick>=LEOS.backAt){ LEOS.p=leoAtCounter(); LEOS.state="back";
      tip("Leo is back, and he looks worried."); }
  } else if(s==="back"){ if(georgeWalk(p)){ p.dir="up"; LEOS.state="ask"; leoTalk(); } }
  else if(s==="leave"){ if(georgeWalk(p)){ LEOS.p=null; LEOS.state="done"; } }
}
// tapping the shop floor: is it the wallet?
function leoWalletAt(x,y){ const w=LEOS.wallet; return LEOS.state==="gone" && !!w && w[0]===x && w[1]===y; }
function leoFindWallet(){ LEOS.state="found"; leoTalk(); }
function leoActor(){
  const p=LEOS.p; if(!p) return null;
  const step=p.moving?Math.sin(p.t*0.9):0, bob=p.moving&&Math.abs(step)>0.5;
  return {y:p.py+13, draw:()=>drawFigure(ctx,Math.round(p.px),Math.round(p.py),Object.assign({},LEO,{dir:p.dir,step,bob}))};
}
// a small brown wallet lying on the floor, with a glint now and then so it catches the eye
function drawWallet(){
  if(LEOS.state!=="gone" || !LEOS.wallet) return;
  const [x,y]=LEOS.wallet, X=x*TS+4, Y=y*TS+9;
  R(ctx,X,Y,9,6,INK); R(ctx,X+1,Y+1,7,4,"#7a4a26"); R(ctx,X+1,Y+1,7,1,"#9a6236");
  R(ctx,X+5,Y+2,3,2,"#5c361b"); R(ctx,X+6,Y+2,1,1,"#e3c27a");
  if(((ANIM>>3)&7)===0){ R(ctx,X+2,Y-2,1,1,"#fffaf0"); R(ctx,X+1,Y-1,3,1,"#fffaf0"); R(ctx,X+2,Y,1,1,"#fffaf0"); }
}

/* ============================================================
   SAVE
   The whole shop is one plain object, so a save is a snapshot of S taken at a
   phase boundary — a morning or an evening, when nobody is mid-walk. Quitting
   during a trading day therefore resumes at that morning and the day replays,
   which costs a minute and spares us serialising live pathfinding state.

   Two tiers, and the game is playable with neither: localStorage always (same
   browser, works when the file is opened directly), and the artifact's own db
   when the page is running inside a viewer that grants it (same save on any
   device you open the link from). Whichever copy is newer wins at boot.
   ============================================================ */
// v2: grandfather's shop. The floor, shelf size and stock model all changed, so v1 saves don't carry over.
const SAVE_KEY="cornerbooks.save.v2", SAVE_V=2;
let saveState="local";            // "local" | "synced" | "error"

function takeSnapshot(){
  return {
    v:SAVE_V, phase:(S.phase==="evening"?"evening":"morning"),
    day:S.day, cash:S.cash, rep:S.rep, tier:S.tier, gw:GW, gh:GH,
    grid:S.grid, slots:S.slots, stock:S.stock, incoming:S.incoming, sales:S.sales, offers:S.offers, keeper:S.keeper,
    stats:S.stats, history:S.history, soldEver:S.soldEver, featured:S.featured,
    seen:S.seen, tutorial:S.tutorial, shopName:S.shopName, library:S.library,
    footfall:S.footfall, stamps:S.stamps, guestbook:S.guestbook, mags:S.mags, events:S.events,
  };
}
function validSave(d){
  return !!d && d.v===SAVE_V && Number.isFinite(d.day) && Number.isFinite(d.cash)
    && Number.isFinite(d.gw) && Number.isFinite(d.gh)
    && Array.isArray(d.grid) && d.grid.length===d.gh
    && Array.isArray(d.grid[0]) && d.grid[0].length===d.gw
    && !!d.slots && !!d.stock;
}
function applySnapshot(d){
  // The account copy comes back from the db frozen, and the game mutates S in place
  // (S.stats.spent=0 at the next morning threw "read only property"). Take our own copy.
  d=JSON.parse(JSON.stringify(d));
  GW=d.gw; GH=d.gh;
  S.day=d.day; S.cash=d.cash; S.rep=d.rep; S.tier=d.tier;
  S.grid=d.grid; S.slots=d.slots; S.stock=d.stock; S.offers=Array.isArray(d.offers)?d.offers:[];
  // older saves kept orders as {bookId: copies}, all due the next morning
  S.incoming=Array.isArray(d.incoming)?d.incoming
    :Object.keys(d.incoming||{}).map(k=>({id:+k,n:d.incoming[k],due:d.day+1}));
  S.sales=Array.isArray(d.sales)?d.sales:[];
  S.keeper=d.keeper; S.stats=d.stats; S.history=d.history||[];
  S.soldEver=d.soldEver||{}; S.featured=d.featured; S.seen=d.seen||{};
  S.tutorial=!!d.tutorial; S.shopName=d.shopName||""; S.library=d.library||{};
  S.footfall=d.footfall||0;
  S.stamps=Array.isArray(d.stamps)?d.stamps:[];
  S.guestbook=Array.isArray(d.guestbook)&&d.guestbook.length?d.guestbook:[GRANDFATHER_ENTRY];
  S.mags=Array.isArray(d.mags)?d.mags.filter(m=>m&&MAG(m.id)):[];
  S.events=(d.events&&typeof d.events==="object")?d.events:{};
  georgeReset(); leoReset();
  S.phase=(d.phase==="evening")?"evening":"morning";
  // anything that only exists inside a trading day is rebuilt, never restored
  S.customers=[]; S.spawnQueue=[]; S.talking=null; S.placing=null;
  S.seenToday=[]; S.dayCast=[]; S.tick=0; S.tab="stock";
  catGoHome();
  resizeStage();
  placeInfoDesk(false);                // saves from before the information counter get one
  placeRack(false);                    // and the magazine rack
  placeRecordCorner(false);            // and the record corner
  restockShelves();                    // and display tables saved empty get their two books
}

/* ---------- browser copy ---------- */
function localRead(){
  try{ const raw=localStorage.getItem(SAVE_KEY); return raw?JSON.parse(raw):null; }
  catch(e){ return null; }               // private window, blocked storage, corrupt JSON
}
function localWrite(json){ try{ localStorage.setItem(SAVE_KEY,json); }catch(e){} }
function localClear(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ---------- account copy ---------- */
let cloudDoc=null, cloudPromise=null, cloudWriting=false, cloudPending=null;
async function cloudInit(){
  try{
    if(!(window.claude && typeof window.claude.use==="function")) return null;  // opened as a file
    const [db,user]=await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db||!user) return null;
    const uid=await user.id();          // per-viewer private subtree; null means no private store
    if(!uid) return null;
    cloudDoc=db.doc("data/users/"+uid+"/save");
    return cloudDoc;
  }catch(e){ return null; }
}
function cloudLoad(){
  if(!cloudPromise) cloudPromise=cloudInit()
    .then(doc=>doc?doc.get():null)
    .then(snap=>{ if(snap){ saveState="synced"; return snap.exists?snap.data():null; } return null; })
    .catch(()=>null);
  return cloudPromise;
}
async function cloudWrite(d){
  if(!cloudDoc) return;
  cloudPending=d;
  if(cloudWriting) return;              // one write at a time per document
  cloudWriting=true;
  try{
    while(cloudPending){ const body=cloudPending; cloudPending=null; await cloudDoc.set(body); }
    saveState="synced";
  }catch(e){
    cloudPending=null;
    if(e && (e.code==="revoked"||e.code==="not_granted"||e.code==="capability_disabled"
             ||e.code==="capability_removed"||e.code==="invalid_argument")) cloudDoc=null;
    saveState="error";                  // the browser copy still went through
  }finally{ cloudWriting=false; }
}

/* ---------- autosave ---------- */
let saveTimer=null, lastJSON="";
function autosave(){
  if(S.phase==="open") return;          // never mid-day: customers do not serialise
  clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,900);
}
function saveNow(){
  const d=takeSnapshot(), j=JSON.stringify(d);
  if(j===lastJSON) return;              // nothing actually changed
  lastJSON=j;
  d.savedAt=Date.now();
  const body=JSON.stringify(d);
  localWrite(body);
  cloudWrite(JSON.parse(body));         // never hand the db the live objects S is still using
}
function clearSave(){
  clearTimeout(saveTimer); lastJSON="";
  localClear();
  if(cloudDoc) cloudDoc.delete().catch(()=>{});
}
function saveNote(){
  if(saveState==="synced") return "Saved automatically · synced to your Claude account, so the same shop opens on any device.";
  if(saveState==="error")  return "Saved automatically in this browser. Syncing to your account failed this session.";
  return "Saved automatically in this browser.";
}

/* ---------- boot ---------- */
// The title screen is up from the first frame. Continue waits on the save lookup, which
// races the account copy against a 2.2s timeout so a slow viewer never holds up the menu.
let bootDecided=false, bootSave=null, bootPending=true, inSession=false;
const FRESH_KEY="cornerbooks.fresh";       // carried across the reload that Start over does
const PHASE_WORD={morning:"morning",open:"open for trading",evening:"closed for the night"};
function newerSave(a,b){
  if(!validSave(a)) a=null;
  if(!validSave(b)) b=null;
  if(a&&b) return (b.savedAt||0)>(a.savedAt||0) ? b : a;
  return a||b;
}
async function boot(){
  const local=localRead();
  const res=await Promise.race([cloudLoad(), new Promise(r=>setTimeout(()=>r("wait"),2200))]);
  bootSave=newerSave(local, res==="wait"?null:res); bootPending=false;
  if(!bootDecided) titleScreen();
  if(res==="wait") cloudLoad().then(c=>{
    if(bootDecided || !c || newerSave(bootSave,c)!==c) return;
    bootSave=c;                                          // the account copy turned up late
    if(titleOn()) titleScreen();
  });
}
function takeFresh(){
  try{ const f=sessionStorage.getItem(FRESH_KEY); sessionStorage.removeItem(FRESH_KEY); return !!f; }
  catch(e){ return false; }
}

/* ---------- title screen ---------- */
function titleOn(){ return $("#title").classList.contains("on"); }
function hideTitle(){ $("#title").classList.remove("on"); document.body.classList.remove("titling"); paused=false; }
function liveSummary(){ return {shopName:S.shopName,day:S.day,cash:S.cash,rep:S.rep,tier:S.tier,phase:S.phase}; }
function titleScreen(){
  paused=true;
  const I=$("#titleIn"); I.innerHTML=""; $("#title").classList.add("on"); document.body.classList.add("titling");
  const hero=el("div","hero");
  const img=document.createElement("img"); img.src=keeperPortrait(); img.alt="You, behind the counter";
  hero.appendChild(img);
  const mark=el("div","mark"); mark.appendChild(el("div","logo",ICON.stock));
  const w=el("div"); w.appendChild(el("h1",null,DEFAULT_SHOP));
  w.appendChild(el("small",null,"A bookshop on an old shopping street. Every book on the shelves is real."));
  mark.appendChild(w); hero.appendChild(mark); I.appendChild(hero);
  if(!inSession && bootPending){ I.appendChild(el("div","empty","Looking for your shop…")); return; }

  // in a session, Continue just lifts the title off the game still in memory
  const d=inSession ? liveSummary() : bootSave;
  if(d){
    const c=el("div","card resume"), m=el("div","meta");
    m.appendChild(el("div","t",shopLabel(d.shopName)));
    m.appendChild(el("div","a","Day "+d.day+" · "+PHASE_WORD[d.phase]));
    const tr=el("div","tagrow");
    tr.appendChild(el("span","tag",rm(d.cash)));
    tr.appendChild(el("span","tag b","Reputation "+Math.round(d.rep||0)));
    tr.appendChild(el("span","tag g",SIZE_TIERS[d.tier||0].name));
    m.appendChild(tr); c.appendChild(m); I.appendChild(c);
    const go=el("button","btn-go",inSession ? "Back to day "+d.day
      : (d.phase==="evening"?"Close out day ":"Open up on day ")+d.day);
    go.onclick=inSession ? hideTitle : ()=>continueSave(d);
    I.appendChild(go);
  }
  const fresh=el("button","btn-go"+(d?" btn-w":""),"New shop");
  fresh.onclick=()=>{ if(inSession) confirmStartOver(closeModal); else if(d) confirmReplace(d); else newShop(); };
  I.appendChild(fresh);
  const how=el("button","btn-go btn-w","How to play");
  how.onclick=()=>howToPlay(closeModal);
  I.appendChild(how);
  const mu=el("button","btn-sm title-music");
  const paintMu=()=>{ mu.textContent=musicOn?"♪ Music on":"♪ Music off"; mu.setAttribute("aria-pressed",String(musicOn)); };
  mu.onclick=()=>{ musicBtn.click(); paintMu(); };
  paintMu(); I.appendChild(mu);
  I.appendChild(el("div","menu-foot","Progress saves automatically each morning and each evening."));
}
function continueSave(d){
  bootDecided=true;
  try{ applySnapshot(d); }catch(e){ newShop(); return; }
  lastJSON=JSON.stringify(takeSnapshot());
  inSession=true; hideTitle(); closeModal(); paint();
}
function newShop(){ bootDecided=true; inSession=true; hideTitle(); prelude(0); }
function confirmReplace(d){
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  sh.appendChild(el("h2",null,"Start a new shop?")).style.marginBottom="10px";
  sh.appendChild(el("div","say","You already have "+shopLabel(d.shopName)+" — day "+d.day+", "+
    rm(d.cash)+" in the till, reputation "+Math.round(d.rep||0)+". A new shop replaces it the first time the new one saves, and it cannot be brought back after that."));
  const yes=primary("Start a new shop",()=>{ closeModal(); newShop(); });
  yes.style.background="var(--red)";
  sh.appendChild(yes);
  sh.appendChild(ghost("Keep my shop",closeModal));
}
function confirmStartOver(back){
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  sh.appendChild(el("h2",null,"Start over?")).style.marginBottom="10px";
  sh.appendChild(el("div","say","This erases "+shopLabel()+" — day "+S.day+", "+rm(S.cash)+
    " in the till and every reader who remembers you — and starts again from the day you inherited the shop. It cannot be undone."));
  const yes=primary("Erase it and start again",()=>{
    clearSave();
    try{ sessionStorage.setItem(FRESH_KEY,"1"); }catch(e){}
    setTimeout(()=>location.reload(),120);
  });
  yes.style.background="var(--red)";
  sh.appendChild(yes);
  sh.appendChild(ghost("Keep my shop",back));
}

/* ---------- in-game menu ---------- */
// Opening it stops the trading clock: the loop only ticks while nothing is paused.
function openMenu(){
  if(S.talking || titleOn()) return;
  paused=true;
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  sh.appendChild(el("h2",null,S.phase==="open"?"Paused":"Menu")).style.marginBottom="10px";
  sh.appendChild(el("div","say",shopLabel()+" · day "+S.day+", "+PHASE_WORD[S.phase]+"."+
    (S.phase==="open"?" The clock has stopped — nobody's patience runs down while this is open.":"")));
  const L=el("div","list");
  const item=(icon,t,a,fn,cls)=>{
    const b2=el("button","li"+(cls?" "+cls:"")); b2.appendChild(el("div","ic",icon));
    const m=el("div","meta"); m.appendChild(el("div","t",t)); m.appendChild(el("div","a",a)); b2.appendChild(m);
    b2.onclick=fn; L.appendChild(b2);
  };
  item(ICON.play,"Resume","Back to the shop floor.",resumeGame);
  item(ICON.help,"How to play","The day, the customers, and how a sale is decided.",()=>howToPlay(openMenu));
  item(ICON.home,"Back to title","Leave the shop as it is. Continue picks up right here.",()=>{ closeModal(); titleScreen(); });
  item(ICON.reset,"Start over","Erase this shop and start again from the inheritance.",()=>confirmStartOver(openMenu),"danger");
  sh.appendChild(L);
  sh.appendChild(el("div","note",saveNote()+(S.phase==="open"
    ?" Today's trading is written down when the shutters come down; close the tab now and this morning replays.":"")));
}
function resumeGame(){ closeModal(); paused=false; }
$("#menuBtn").onclick=openMenu;
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape" || titleOn() || S.talking) return;
  if(STK.open) closeStockTake();
  else if(paused) resumeGame();
  else if(!$("#modal").classList.contains("on")) openMenu();
});

/* ---------- how to play ---------- */
function phaseList(){
  const L=el("div","list"); L.style.marginBottom="10px";
  [[ICON.stock,"Morning","Order stock, set prices, fit out the shop."],
   [ICON.shop,"Open","Customers come in. Tap one, ask up to three questions, then put up to four books from your shelves in front of them."],
   [ICON.price,"Closed","Count the takings, pay the rent, and restock what sold."]].forEach(([ic,t,d])=>{
    const li=el("div","li"); li.appendChild(el("div","ic",ic));
    const m=el("div","meta"); m.appendChild(el("div","t",t)); m.appendChild(el("div","a",d)); li.appendChild(m); L.appendChild(li);
  });
  return L;
}
function howToPlay(back){
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  sh.appendChild(el("h2",null,"How to play")).style.marginBottom="10px";
  sh.appendChild(el("p",null,"Two things decide whether you survive: what you choose to stock, and whether you can read the person standing in front of you."));
  sh.appendChild(phaseList());
  sh.appendChild(el("h3",null,"Making a sale"));
  sh.appendChild(el("p",null,"Tap a customer to talk. Each question costs them a little patience and turns up a clue — a mood, a budget, something they won't read. Then pull books for them: up to ten come off your shelves, mostly in the genres they read, and you choose up to four to show them."));
  sh.appendChild(el("p",null,"Of the ten, up to five genuinely suit them — right mood, within budget, nothing they refuse — and of those, just two are books they would actually buy. Put either of those two on the pile and they take one home. A pile that suits them but misses both, they'll admire and leave; a pile that doesn't suit them, they'll tell you what they were after. A perfect match grows your reputation fastest."));
  sh.appendChild(el("h3",null,"Stock take"));
  sh.appendChild(el("p",null,"The clipboard in the top bar opens the stock take at any time: every book you hold with its full description, filters by genre and era, and reorders of anything you carry. The clock stops while it's open. New titles come only on the distributor's van, which turns up every morning from day 2 with eight books you've never stocked. Every order — reorder, restock or van — arrives two days after you place it, before the shop opens. The stock take's Sold out tab, and the Sold out list on the morning Stock tab, restock any title with +1."));
  sh.appendChild(el("h3",null,"Information counter"));
  sh.appendChild(el("p",null,"The blue counter by the door holds grandfather's shop stamp and the guest book. Tap it to stamp in for the day, and to read what your customers have written."));
  sh.appendChild(el("h3",null,"Magazine rack and record corner"));
  sh.appendChild(el("p",null,"The rack on the other side of the door puts up a new magazine every real-world week — a yellow dot over it means this week's title is waiting. Grandfather's turntable sits in the corner by the window: tap it to choose which record is playing, or lift the needle."));
  sh.appendChild(el("h3",null,"Money"));
  sh.appendChild(el("p",null,"Rent is paid at close. You cannot go bankrupt, and rent only rises when you choose to expand the floor. More floor means room for more shelves; the Coffee Corner unlocks as your reputation grows."));
  sh.appendChild(el("p",null,"Every book is real. Tap any cover to read it up properly."));
  sh.appendChild(primary(back===closeModal?"Got it":"Back to menu",back));
}

initGrid(); seedStock(); paint();
requestAnimationFrame(loop);
// covers and the sign are set in the pixel webfont: redraw once it has arrived
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ resizeStage(); try{ if(!titleOn()) paint(); }catch(e){} });
function nameScreen(){
  const sh=$("#sheet"); sh.innerHTML="";
  $("#modal").classList.add("on");
  const portrait=document.createElement("img"); portrait.className="keeper-portrait";
  portrait.src=keeperPortrait(); portrait.alt="You, behind the counter";
  sh.appendChild(portrait);
  sh.appendChild(el("h2",null,"Repaint the sign"));
  sh.appendChild(el("p",null,"Grandfather's sign has faded past reading. Every shopfront on the street has a name painted above the door — what will yours say?"));
  const field=el("div","field");
  field.appendChild(el("label",null,"Shop name"));
  const row=el("div","namerow");
  const inp=document.createElement("input");
  inp.id="shopName"; inp.type="text"; inp.maxLength=24; inp.placeholder=DEFAULT_SHOP;
  inp.autocomplete="off"; inp.value=S.shopName;
  row.appendChild(inp);
  const chk=el("span","check"+(S.shopName?" on":""),"✓");
  inp.addEventListener("input",()=>chk.classList.toggle("on",!!inp.value.trim()));
  row.appendChild(chk);
  field.appendChild(row);
  sh.appendChild(field);
  sh.appendChild(el("p",null,"Leave it blank and the sign just reads CORNER BOOKS."));
  const go=primary("Paint the sign",()=>{ S.shopName=inp.value.trim().slice(0,24); hud(); introScreen(); autosave(); });
  sh.appendChild(go);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") go.click(); });
  setTimeout(()=>inp.focus(),50);
}
/* ---------- prelude ----------
   Shown once, when a new game starts: the inheritance, then naming the shop. */
const PRELUDE=[
  {h:"A letter, and a set of keys",
   p:["Your grandfather passed away last month. He was eighty-seven, and he kept his bookshop open until the week before.",
      "At the reading of the will, the solicitor slides a ring of old brass keys across the desk. \"He left you the shop,\" she says. \"All of it.\""]},
  {h:"The shop on the old street",
   p:["It is exactly as he left it. Twelve shelves and a hundred books, no two alike. A counter worn smooth by forty years of elbows. His cat, asleep on its cushion in the corner as though nothing has happened.",
      "Pinned beside the till, in his handwriting: \"Every book has its reader. Our job is to introduce them.\""]},
  {h:"What will you do?",
   p:["A developer has already written, twice, offering to buy the building. You could take the money.",
      "Or you could turn the sign on the door to OPEN, and keep the family bookshop going."]},
];
function prelude(i){
  const pg=PRELUDE[i], sh=$("#sheet"); sh.innerHTML=""; setLock(true);
  $("#modal").classList.add("on");
  if(i===1){ const im=document.createElement("img"); im.className="keeper-portrait"; im.src=keeperPortrait(); im.alt="Behind grandfather's counter"; sh.appendChild(im); }
  sh.appendChild(el("h3",null,"Prelude · "+(i+1)+" of "+PRELUDE.length)).style.marginTop="0";
  sh.appendChild(el("h2",null,pg.h)).style.marginBottom="10px";
  pg.p.forEach(t=>sh.appendChild(el("p","prelude",t)));
  const last=i===PRELUDE.length-1;
  sh.appendChild(primary(last?"Keep the family bookshop open":"Continue",()=>last?nameScreen():prelude(i+1)));
  if(i>0) sh.appendChild(ghost("← Back",()=>prelude(i-1)));
  sh.scrollTop=0;
}
function introScreen(){
  const sh=$("#sheet"); sh.innerHTML=""; setLock(false);
  $("#modal").classList.add("on");
  sh.appendChild(el("h2",null,shopLabel())).style.marginBottom="10px";
  sh.appendChild(el("div","say","Grandfather's shop, yours since this morning. Twelve shelves holding a hundred books, one copy each, a counter, a magazine rack, his record player, a palm and a cat — and $1,500 in the business account. Rent is $50 a day. Grow your reputation and cash and you can expand the floor, add shelves, and in time open a Coffee Corner."));
  sh.appendChild(el("p",null,"Two things decide whether you survive: what you choose to stock, and whether you can read the person standing in front of you."));
  sh.appendChild(phaseList());
  sh.appendChild(el("p",null,"Every book is real. The clipboard at the top opens the stock take — the whole inventory, with every description — any time you like."));
  sh.appendChild(primary("Open up",()=>{ closeModal(); paint(); }));
}
if(takeFresh()){ cloudLoad(); newShop(); }      // Start over reloads straight into naming the new shop
else { titleScreen(); setTimeout(boot,200); }
</script>
